{% if config.extra.product_toggle and config.extra.product_toggle.enabled %}
  <div class="wso2-header-product-switch"
       data-wso2-product-toggle
       data-target-url="{{ config.extra.product_toggle.target_url }}"
       {% if page %}data-page-url="{{ page.url | e }}"{% endif %}
       data-active="{{ 'cloud' if config.extra.product == 'asgardeo' else 'onprem' }}">
    <span class="wso2-product-switch-thumb" aria-hidden="true"></span>
    <button type="button" class="wso2-product-switch-option" data-choice="cloud" aria-pressed="{{ 'true' if config.extra.product == 'asgardeo' else 'false' }}" aria-label="Switch to SaaS docs">
      <svg class="wso2-product-switch-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.49 7.49 0 0 0-7.35 6.04A5.5 5.5 0 0 0 6 20h13a5 5 0 0 0 .35-9.96Z"/></svg>
      <span>SaaS</span>
    </button>
    <button type="button" class="wso2-product-switch-option" data-choice="onprem" aria-pressed="{{ 'false' if config.extra.product == 'asgardeo' else 'true' }}" aria-label="Switch to Self-Managed docs">
      <svg class="wso2-product-switch-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" d="M4 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4Zm0 10a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6Z"/></svg>
      <span>Self-Managed</span>
    </button>
    <span class="wso2-product-switch-status" role="status" hidden></span>
  </div>
{% endif %}
