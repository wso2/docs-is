openapi: 3.0.0
info:
  version: "v1"
  title: WSO2 Identity Server - Organization User Password Management API
  description: |
    This is the RESTful API for self-password updates by users of an organization in WSO2 Identity Server, allowing authenticated organization users to change their own passwords.

    <b>Scope(Permission) required:</b> `internal_org_user_password_update`

    <b>Note</b>: To change the password of a user who belongs to the root organization (tenant), use the <a href="../../self-password-update-rest-api/">self password update API</a>.

    <b>Note</b>: This API is available only in WSO2 Identity Server 7.2.0, beginning with update level 37 (Updates 2.0 model). To update your server, see the instructions on
    <a href="https://updates.docs.wso2.com/en/latest/updates/overview/" target="_blank">updating WSO2 products</a>.

    <b>Mandatory server configuration</b> <br>
    In WSO2 Identity Server 7.2.0, the API resources and the authorization rules for this API are not registered by default. Add the following configuration to the `deployment.toml` file found in the `<IS_HOME>/repository/conf` directory and restart the server.

    ```toml
    # [Organization] User Password Update API (must come before the tenant rule)
    [[resource.access_control]]
    context = "(.*)/o/api/users/v1/me/change-password"
    allowed_auth_handlers = ["OAuthAuthentication","TomcatCookieAuthentication"]
    secure = "true"
    http_method = "POST"
    scopes = ["internal_org_user_password_update"]

    # User Password Update API
    [[resource.access_control]]
    context = "(.*)/api/users/v1/me/change-password"
    allowed_auth_handlers = ["OAuthAuthentication","TomcatCookieAuthentication"]
    secure = "true"
    http_method = "POST"
    scopes = ["internal_user_password_update"]

    [[api_resources]]
    name = "User Password Update API"
    identifier = "/api/users/v1/me/change-password"
    requiresAuthorization = false
    description = "API representation of the User Password Update API"
    type = "TENANT"
    disabled = false

    [[api_resources.scopes]]
    displayName = "Update User Password"
    name = "internal_user_password_update"
    description = "Update password of the authenticated user"

    [[api_resources]]
    name = "User Password Update API"
    identifier = "/o/api/users/v1/me/change-password"
    requiresAuthorization = false
    description = "API representation of the User Password Update API"
    type = "ORGANIZATION"
    disabled = false

    [[api_resources.scopes]]
    displayName = "Update User Password"
    name = "internal_org_user_password_update"
    description = "Update password of the authenticated user in the organization"
    ```

    <blockquote><p><strong>⚠️ The order of the <code>resource.access_control</code> rules matters.</strong></p>
    <p>The organization-level rule for <code>(.*)/o/api/users/v1/me/change-password</code> must be placed <strong>before</strong> the tenant-level rule for <code>(.*)/api/users/v1/me/change-password</code>, because the tenant-level pattern also matches the <code>/o/</code> endpoint. If the tenant-level rule is evaluated first, requests to the organization endpoint are authorized against <code>internal_user_password_update</code> instead of <code>internal_org_user_password_update</code>, and the request fails with an authorization error.</p>
    </blockquote>

    <blockquote><p><strong>⚠️ Mandatory Configuration</strong></p>
    <p>To enable this API, you must authorize the following API resource within your application settings in the WSO2 Identity Server Console:</p>
    <ul>
    <li><strong>API Resource:</strong> <code>/o/api/users/v1/me/change-password</code></li>
    <li><strong>Authorization Policy:</strong> Set to <code>No Authorization Policy</code></li>
    <li><strong>Required Scope:</strong> <code>internal_org_user_password_update</code></li>
    </ul>
    <p>Once these settings are applied, any organization user who authenticates through the application and requests the <code>internal_org_user_password_update</code> scope will be granted permission automatically. Applications that have not configured this specific API resource and policy will be unable to support self-password updates via this API.</p>
    </blockquote>
security:
  - OAuth2:
      - internal_org_user_password_update
tags:
  - name: me
    description: Operations for the authenticated organization user.
servers:
  - url: 'https://{serverUrl}/t/{tenantDomain}/o/api/users/v1'
    variables:
      serverUrl:
        default: localhost:9443
      tenantDomain:
        default: carbon.super

paths:
  /me/change-password:
    post:
      tags:
        - me
      summary: Change organization user password
      description: |
        This API is used to change the password of the authenticated organization user.

        <b>Scope(Permission) required:</b> `internal_org_user_password_update`
      operationId: changeOrganizationUserPassword
      requestBody:
        description: Password change request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    #-----------------------------------------------------
    # Password Change Request object
    #-----------------------------------------------------
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: Current password of the user.
          example: "CurrentPassword123"
        newPassword:
          type: string
          description: New password to set for the user.
          example: "NewPassword456"

    #-----------------------------------------------------
    # Error object
    #-----------------------------------------------------
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "PWD-10001"
        message:
          type: string
          example: "Invalid current password"
        description:
          type: string
          example: "The current password provided is incorrect."
        traceId:
          type: string
          example: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"

  #-----------------------------------------------------
  # Descriptions of common responses
  #-----------------------------------------------------
  responses:
    Success:
      description: Password successfully changed
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            InvalidCurrentPassword:
              $ref: '#/components/examples/InvalidCurrentPassword'
            PasswordPolicyViolation:
              $ref: '#/components/examples/PasswordPolicyViolation'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  #-----------------------------------------------------
  # Examples
  #-----------------------------------------------------
  examples:
    InvalidCurrentPassword:
      summary: Wrong current password
      value:
        code: "PWD-10001"
        message: "Invalid current password"
        description: "The current password provided is incorrect."
        traceId: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"
    PasswordPolicyViolation:
      summary: New password too weak
      value:
        code: "PWD-10003"
        message: "Password policy violation"
        description: "The minimum length of password should be 8."
        traceId: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://localhost:9443/oauth2/authorize'
          tokenUrl: 'https://localhost:9443/oauth2/token'
          scopes:
            internal_org_user_password_update: Allows the authenticated organization user to update their own password.
