openapi: 3.0.0
info:
  version: v2
  title: WSO2 Identity Server - Webhook Management Rest API
  description: >
    The Webhook Management REST API provides a standardized interface to manage webhooks within WSO2 Identity Server. Webhooks allow external systems to receive real-time notifications for various events, such as login successes or failures, enabling seamless integration and automation across external applications and services.

    This API empowers developers and administrators to create, update, delete, and retrieve webhook configurations tailored to their specific business needs and event-driven workflows.


    <b>Changes from v1</b>


    v1 remains available at `/api/server/v1`.


    - `subscribedChannels` is a list of objects (`channelUri` and `childOrgSubscription`) instead of a list of channel URI strings.

    - The update operation no longer accepts `status`. Use the activate and deactivate operations instead.

    - Webhook status can also be `PARTIALLY_ACTIVE` or `PARTIALLY_INACTIVE`.

    - The webhook list is paginated.

    - New `PATCH` operation for partial updates.

    - Each channel can also subscribe to events fired from child organizations.

    - New channel and subscribed organizations resources.


    <b>Resource model</b>


    - A webhook has a set of subscribed channels. Each channel has a child organization subscription policy (`childOrgSubscription`).

    - Channels and their policies are written only through the webhook resource (create, update and patch).

    - Each channel in the webhook response has a `self` link to the channel resource.

    - The channel resource has an `organizationsRef` link to the paginated list of child organizations the channel is subscribed to.
servers:
  - url: "https://{server-url}/t/{tenant-domain}/api/server/v2"
    variables:
      server-url:
        default: "localhost:9443"
      tenant-domain:
        default: carbon.super

security:
  - OAuth2: []
  - BasicAuth: []

paths:
  /webhooks:
    get:
      summary: List Webhooks
      description: |
        This API returns a paginated list of webhooks.

        <b>Scope(Permission) required:</b> `internal_webhook_mgt_view`
      operationId: getWebhooks
      tags:
        - Webhooks
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks?limit=25&offset=0' \
            -H 'Authorization: Bearer {bearer_token}'

    post:
      summary: Add Webhook
      description: "Create a new webhook.\n\n <b>Scope(Permission) required:</b> `internal_webhook_mgt_create` \n\n"
      operationId: createWebhook
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Webhook Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
              examples:
                created:
                  summary: "Webhook created. Channels are subscribed asynchronously, so they start as `SUBSCRIPTION_PENDING`."
                  value:
                    id: eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c
                    createdAt: '2026-09-03T09:15:00Z'
                    updatedAt: '2026-09-03T09:15:00Z'
                    endpoint: https://example.com/webhook
                    name: Login Webhook
                    eventProfile:
                      name: WSO2
                      uri: https://schemas.identity.wso2.org/events
                    status: PARTIALLY_ACTIVE
                    subscribedChannels:
                      - channelUri: https://schemas.identity.wso2.org/events/login
                        channelId: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
                        self: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
                        status: SUBSCRIPTION_PENDING
                        childOrgSubscription:
                          subscriptionPolicy: "NONE"
                      - channelUri: https://schemas.identity.wso2.org/events/registration
                        channelId: 4d81e0c7-6f52-4a19-b3ce-118d9f27a604
                        self: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/4d81e0c7-6f52-4a19-b3ce-118d9f27a604
                        status: SUBSCRIPTION_PENDING
                        childOrgSubscription:
                          subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
                      - channelUri: https://schemas.identity.wso2.org/events/token
                        channelId: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
                        self: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
                        status: SUBSCRIPTION_PENDING
                        childOrgSubscription:
                          subscriptionPolicy: "SELECTED_ORGS_ONLY"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request POST 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks' \
            -H 'Authorization: Bearer {bearer_token}' \
            -H 'Content-Type: application/json' \
            -d '{
              "endpoint": "https://example.com/webhook",
              "name": "Login Webhook",
              "secret": "my-secret",
              "eventProfile": {
                "name": "WSO2",
                "uri": "https://schemas.identity.wso2.org/events"
              },
              "subscribedChannels": [
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/login",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "NONE"
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/registration",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "ALL_EXISTING_AND_FUTURE_ORGS"
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/token",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "SELECTED_ORGS_ONLY",
                    "organizations": [
                      { "orgId": "b028ca17-8f89-449c-ae27-fa955e66465d" },
                      { "orgId": "a17b28ca-9f89-449c-ae27-fa955e66465f" }
                    ]
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/user"
                }
              ],
              "status": "ACTIVE"
            }'

  /webhooks/{webhookId}:
    get:
      summary: Retrieve Webhook by ID
      description: |
        This API returns the details of a webhook.

        - Each channel in `subscribedChannels` has a `self` link to the channel API.
        - Child organizations subscribed to a channel are not included. Use the channel organizations API to get them.

        <b>Scope(Permission) required:</b> `internal_webhook_mgt_view`
      operationId: getWebhookByWebhookId
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}'

    put:
      summary: Update Webhook
      description: |
        This API replaces a webhook and returns the updated webhook.

        - Properties omitted from the request are cleared, except `secret` and `childOrgSubscription.organizations`, which keep their stored values.
        - `subscribedChannels` replaces the existing channels. Channels not in the list are unsubscribed, and new channels are subscribed.
        - If a channel omits `childOrgSubscription`, an existing channel keeps its policy and a new channel uses `NONE`.
        - To stop subscribing to a channel's events from child organizations, set `subscriptionPolicy` to `NONE`.
        - `status` can't be updated. Use the activate and deactivate APIs.

        <b>Scope(Permission) required:</b> `internal_webhook_mgt_update`
      operationId: updateWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdateRequest'
      responses:
        '200':
          description: Webhook Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request PUT 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}' \
            -H 'Content-Type: application/json' \
            -d '{
              "endpoint": "https://example.com/webhook",
              "name": "Login webhook",
              "eventProfile": {
                "name": "WSO2",
                "uri": "https://schemas.identity.wso2.org/events"
              },
              "subscribedChannels": [
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/login",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "SELECTED_ORGS_ONLY",
                    "organizations": [
                      { "orgId": "b028ca17-8f89-449c-ae27-fa955e66465d" }
                    ]
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/registration",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "ALL_EXISTING_AND_FUTURE_ORGS"
                  }
                }
              ]
            }'

    patch:
      summary: Patch Webhook by ID
      description: |
        This API partially updates a webhook and returns the updated webhook.

        - The request body is a JSON Merge Patch document (RFC 7386) sent as `application/merge-patch+json`.
        - Only the properties in the request are updated. Omitted properties are unchanged.
        - Arrays are replaced, not merged. `subscribedChannels` replaces the existing channels, as in the update API.
        - `null` values and an empty body (`{}`) are rejected with `400`.
        - `status` can't be patched. Use the activate and deactivate APIs.

        <b>Scope(Permission) required:</b> `internal_webhook_mgt_update`
      operationId: patchWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WebhookPatchRequest'
            examples:
              renameOnly:
                summary: Rename a webhook, leaving everything else untouched
                value:
                  name: Login and registration webhook
              changeEndpoint:
                summary: Repoint the webhook
                value:
                  endpoint: https://example.com/webhook/v2
              rotateSecret:
                summary: Replace the signing secret
                value:
                  secret: my-new-secret
              changeChannels:
                summary: "Replace the channel set. `login` keeps its current policy and `token` sets a new one."
                value:
                  subscribedChannels:
                    - channelUri: https://schemas.identity.wso2.org/events/login
                    - channelUri: https://schemas.identity.wso2.org/events/token
                      childOrgSubscription:
                        subscriptionPolicy: SELECTED_ORGS_ONLY
                        organizations:
                          - orgId: b028ca17-8f89-449c-ae27-fa955e66465d
      responses:
        '200':
          description: Webhook Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: "Bad Request. Also returned when a property is `null` or the request body is empty."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request PATCH 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}' \
            -H 'Content-Type: application/merge-patch+json' \
            -d '{
              "name": "Login and registration webhook"
            }'

    delete:
      summary: Delete Webhook
      description: "This API deletes a webhook using the webhook unique ID. \n\n <b>Scope(Permission) required:</b> `internal_webhook_mgt_delete` \n\n"
      operationId: deleteWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Webhook Deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request DELETE 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}'

  /webhooks/{webhookId}/channels/{channelId}:
    get:
      summary: Retrieve Subscribed Channel by ID
      description: |
        This API returns a subscribed channel of a webhook, with its subscription status and child organization subscription policy.

        - Get the `channelId` from `subscribedChannels` in the webhook response.
        - Use `childOrgSubscription.organizationsRef` to get the child organizations the channel is subscribed to.

        <b>Scope(Permission) required:</b> `internal_webhook_mgt_view`
      operationId: getWebhookChannel
      tags:
        - Webhook Channels
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelResponse'
              examples:
                selectedOrgs:
                  summary: Channel subscribed to events from selected child organizations
                  value:
                    channelId: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
                    channelUri: https://schemas.identity.wso2.org/events/token
                    status: SUBSCRIPTION_ACCEPTED
                    childOrgSubscription:
                      subscriptionPolicy: SELECTED_ORGS_ONLY
                      organizationsRef: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219/organizations
                allOrgs:
                  summary: Channel subscribed to events from all child organizations
                  value:
                    channelId: 4d81e0c7-6f52-4a19-b3ce-118d9f27a604
                    channelUri: https://schemas.identity.wso2.org/events/registration
                    status: SUBSCRIPTION_ACCEPTED
                    childOrgSubscription:
                      subscriptionPolicy: ALL_EXISTING_AND_FUTURE_ORGS
                      organizationsRef: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/4d81e0c7-6f52-4a19-b3ce-118d9f27a604/organizations
                noFanout:
                  summary: >
                    Channel not subscribed to events from child organizations. `organizationsRef` is still
                    present; the referenced resource returns an empty list.
                  value:
                    channelId: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
                    channelUri: https://schemas.identity.wso2.org/events/login
                    status: SUBSCRIPTION_ACCEPTED
                    childOrgSubscription:
                      subscriptionPolicy: NONE
                      organizationsRef: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88/organizations
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook or channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}/channels/{channelId}' \
            -H 'Authorization: Bearer {bearer_token}'
  /webhooks/{webhookId}/channels/{channelId}/organizations:
    get:
      summary: List Child Organizations Subscribed to a Channel
      description: |
        This API returns a paginated list of the child organizations a channel is subscribed to. The list depends on the channel's `subscriptionPolicy`:

        - `SELECTED_ORGS_ONLY`: the selected organizations.
        - `ALL_EXISTING_AND_FUTURE_ORGS`: all child organizations, including ones created later.
        - `NONE`: an empty list.

        Parent organizations are listed before their child organizations.

        <b>Scope(Permission) required:</b> `internal_webhook_mgt_view`
      operationId: getChannelSubscribedOrganizations
      tags:
        - Webhook Channels
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/ChannelId'
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribedOrganizationList'
              examples:
                allOrgsPolicy:
                  summary: >
                    Channel subscribed to events from all child organizations. `totalResults` grows
                    as organizations are created, so it can change between pages.
                  value:
                    channelUri: https://schemas.identity.wso2.org/events/registration
                    subscriptionPolicy: ALL_EXISTING_AND_FUTURE_ORGS
                    totalResults: 142
                    startIndex: 0
                    count: 2
                    organizations:
                      - orgId: dd8e0455-29a1-4c73-8d6b-60f88c607d38
                        orgName: sub001
                        parentOrgId: 0e4a3c92-1f7b-4d58-9a06-b3e5c1d78f24
                      - orgId: 7c1f9a83-5b2e-41d7-9f30-2ac4e8b16d55
                        orgName: sub002
                        parentOrgId: dd8e0455-29a1-4c73-8d6b-60f88c607d38
                selectedOrgsPolicy:
                  summary: >
                    Channel subscribed to events from selected child organizations, resolved
                    with names and parents.
                  value:
                    channelUri: https://schemas.identity.wso2.org/events/token
                    subscriptionPolicy: SELECTED_ORGS_ONLY
                    totalResults: 2
                    startIndex: 0
                    count: 2
                    organizations:
                      - orgId: b028ca17-8f89-449c-ae27-fa955e66465d
                        orgName: sub003
                        parentOrgId: 7c1f9a83-5b2e-41d7-9f30-2ac4e8b16d55
                      - orgId: a17b28ca-9f89-449c-ae27-fa955e66465f
                        orgName: sub004
                        parentOrgId: b028ca17-8f89-449c-ae27-fa955e66465d
                noFanout:
                  summary: Channel not subscribed to events from child organizations
                  value:
                    channelUri: https://schemas.identity.wso2.org/events/login
                    subscriptionPolicy: NONE
                    totalResults: 0
                    startIndex: 0
                    count: 0
                    organizations: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook or channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}/channels/{channelId}/organizations?limit=50&offset=0' \
            -H 'Authorization: Bearer {bearer_token}'
  /webhooks/{webhookId}/activate:
    post:
      summary: Activate Webhook
      description: "Activate a webhook by its unique ID.\n\n <b>Scope(Permission) required:</b> `internal_webhook_mgt_update` \n\n"
      operationId: activateWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Webhook Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request POST 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}/activate' \
            -H 'Authorization: Bearer {bearer_token}'

  /webhooks/{webhookId}/deactivate:
    post:
      summary: Deactivate Webhook
      description: "Deactivate a webhook by its unique ID.\n\n <b>Scope(Permission) required:</b> `internal_webhook_mgt_update` \n\n"
      operationId: deactivateWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Webhook Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request POST 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}/deactivate' \
            -H 'Authorization: Bearer {bearer_token}'

  /webhooks/{webhookId}/retry:
    post:
      summary: Retry Webhook Subscription or Unsubscription
      description: |
        This API retries the failed subscriptions and unsubscriptions of a webhook. Only channels in `SUBSCRIPTION_ERROR` or `UNSUBSCRIPTION_ERROR` are retried.

        <b>Scope(Permission) required:</b> `internal_webhook_mgt_update`
      operationId: retryWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Webhook Retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request POST 'https://localhost:9443/t/{tenant-domain}/api/server/v2/webhooks/{webhookId}/retry' \
            -H 'Authorization: Bearer {bearer_token}'

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://localhost:9443/oauth2/authorize'
          tokenUrl: 'https://localhost:9443/oauth2/token'
          scopes:
            internal_webhook_mgt_view: View webhooks
            internal_webhook_mgt_create: Create webhooks
            internal_webhook_mgt_update: Update webhooks
            internal_webhook_mgt_delete: Delete webhooks

  parameters:
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Unique identifier of the webhook.
      schema:
        type: string

    ChannelId:
      name: channelId
      in: path
      required: true
      description: "Unique identifier of the subscribed channel."
      schema:
        type: string

  schemas:
    # =========================================================================
    # Webhook — create
    # =========================================================================
    WebhookCreateRequest:
      type: object
      required:
        - endpoint
        - eventProfile
        - name
        - subscribedChannels
      description: "Webhook to create."
      properties:
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        eventProfile:
          $ref: '#/components/schemas/EventProfile'
        name:
          type: string
          description: Webhook name.
          example: Login Webhook.
        secret:
          type: string
          writeOnly: true
          description: "Secret used to sign webhook payloads. Required for event profiles that sign payloads with a shared secret. Never returned in responses."
          example: my-secret
        subscribedChannels:
          type: array
          minItems: 1
          description: Channels to subscribe to, each with an optional child organization subscription.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: "https://schemas.identity.wso2.org/events/login"
              childOrgSubscription:
                subscriptionPolicy: "NONE"
            - channelUri: "https://schemas.identity.wso2.org/events/registration"
              childOrgSubscription:
                subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
            - channelUri: "https://schemas.identity.wso2.org/events/token"
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
                organizations:
                  - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"
                  - orgId: "a17b28ca-9f89-449c-ae27-fa955e66465f"
            - channelUri: "https://schemas.identity.wso2.org/events/user"
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: "Initial webhook status."
          example: "ACTIVE"

    # =========================================================================
    # Webhook — update
    # =========================================================================
    WebhookUpdateRequest:
      type: object
      required:
        - endpoint
        - eventProfile
        - name
        - subscribedChannels
      description: "Webhook to replace. If `secret` or `childOrgSubscription.organizations` is omitted, the stored value is kept."
      properties:
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        eventProfile:
          $ref: '#/components/schemas/EventProfile'
        name:
          type: string
          description: Webhook name.
          example: Login Webhook.
        secret:
          type: string
          writeOnly: true
          description: "Secret used to sign webhook payloads. If omitted, the stored secret is kept."
          example: my-secret
        subscribedChannels:
          type: array
          minItems: 1
          description: "Channels to subscribe to. Replaces the existing channels. A channel that omits `childOrgSubscription` keeps its current policy, or uses `NONE` if it is new."
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: "https://schemas.identity.wso2.org/events/login"
              childOrgSubscription:
                subscriptionPolicy: "NONE"
            - channelUri: "https://schemas.identity.wso2.org/events/registration"
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
                organizations:
                  - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"

    WebhookPatchRequest:
      type: object
      minProperties: 1
      description: "JSON Merge Patch document with the properties to update. `null` values and an empty document are rejected. `status` can't be patched."
      properties:
        endpoint:
          type: string
          description: Replaces the webhook URL.
          example: https://example.com/webhook
        name:
          type: string
          description: Replaces the webhook name.
          example: Login Webhook.
        secret:
          type: string
          writeOnly: true
          description: Replaces the secret used to validate webhook payloads. Omit to keep the current secret.
          example: my-new-secret
        subscribedChannels:
          type: array
          minItems: 1
          description: "Replaces the existing channels, as in the update API. Omit it to keep the current channels."
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: "https://schemas.identity.wso2.org/events/login"
              childOrgSubscription:
                subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
            - channelUri: "https://schemas.identity.wso2.org/events/token"
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
                organizations:
                  - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"

    # =========================================================================
    # Webhook — response
    # =========================================================================
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: 'eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c'
        createdAt:
          type: string
          readOnly: true
          example: '2024-05-01T12:00:00Z'
        updatedAt:
          type: string
          readOnly: true
          example: '2024-05-02T12:00:00Z'
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        eventProfile:
          $ref: '#/components/schemas/EventProfile'
        name:
          type: string
          description: Webhook name.
          example: Login webhook.
        subscribedChannels:
          type: array
          description: "Subscribed channels with their subscription status and child organization subscription policy."
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: https://schemas.identity.wso2.org/events/login
              channelId: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
              self: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
              status: SUBSCRIPTION_ACCEPTED
              childOrgSubscription:
                subscriptionPolicy: "NONE"
            - channelUri: https://schemas.identity.wso2.org/events/registration
              channelId: 4d81e0c7-6f52-4a19-b3ce-118d9f27a604
              self: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/4d81e0c7-6f52-4a19-b3ce-118d9f27a604
              status: SUBSCRIPTION_ACCEPTED
              childOrgSubscription:
                subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
            - channelUri: https://schemas.identity.wso2.org/events/token
              channelId: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
              self: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
              status: SUBSCRIPTION_ACCEPTED
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
        status:
          type: string
          readOnly: true
          enum:
            - ACTIVE
            - PARTIALLY_ACTIVE
            - INACTIVE
            - PARTIALLY_INACTIVE
          description: "Webhook status, based on the subscription status of its channels. Changed through the activate and deactivate APIs."
          example: "ACTIVE"

    WebhookSubscription:
      type: object
      required:
        - channelUri
      description: "A channel the webhook subscribes to. `channelId`, `self` and `status` are read-only."
      properties:
        channelUri:
          type: string
          description: Channel URI to subscribe to.
          example: https://schemas.identity.wso2.org/events/login
        childOrgSubscription:
          $ref: '#/components/schemas/ChildOrgSubscription'
        channelId:
          type: string
          readOnly: true
          description: "Unique identifier of the subscribed channel."
          example: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
        self:
          type: string
          readOnly: true
          description: "Link to the channel API."
          example: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
        status:
          type: string
          readOnly: true
          enum:
            - SUBSCRIPTION_ACCEPTED
            - SUBSCRIPTION_PENDING
            - SUBSCRIPTION_ERROR
            - UNSUBSCRIPTION_ACCEPTED
            - UNSUBSCRIPTION_PENDING
            - UNSUBSCRIPTION_ERROR
          description: Status of the subscription.
          example: SUBSCRIPTION_PENDING

    # =========================================================================
    # Channel
    # =========================================================================
    ChildOrgSubscription:
      type: object
      required:
        - subscriptionPolicy
      description: |
        Controls which child organizations of the webhook's organization the channel subscribes to events from.

        - `subscriptionPolicy` is returned in responses.
        - `organizations` is write-only. Use `organizationsRef` to get the subscribed organizations.
      properties:
        subscriptionPolicy:
          type: string
          default: NONE
          enum:
            - NONE
            - ALL_EXISTING_AND_FUTURE_ORGS
            - SELECTED_ORGS_ONLY
          description: |
            Child organization subscription policy for the channel.

            - `NONE`: Not subscribed to events fired from child organizations.
            - `ALL_EXISTING_AND_FUTURE_ORGS`: Subscribed to events fired from existing child organizations and child organizations created later.
            - `SELECTED_ORGS_ONLY`: Subscribed to events fired only from the organizations in `organizations`. Events from their child organizations are not included.
          example: SELECTED_ORGS_ONLY
        organizations:
          type: array
          writeOnly: true
          minItems: 1
          maxItems: 100
          description: |
            Child organizations to subscribe to events from. Allowed only when `subscriptionPolicy` is `SELECTED_ORGS_ONLY`.

            - Required when a channel is first set to `SELECTED_ORGS_ONLY`.
            - If supplied, replaces the current list. If omitted, the current list is kept.
            - Can't be empty. To stop subscribing to events from child organizations, set `subscriptionPolicy` to `NONE`.
            - Write-only, so it is never returned in responses.
          items:
            $ref: '#/components/schemas/Organization'
          example:
            - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"
            - orgId: "a17b28ca-9f89-449c-ae27-fa955e66465f"
        organizationsRef:
          type: string
          readOnly: true
          description: "Link to the paginated list of child organizations the channel is subscribed to. Returned only by the channel API."
          example: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219/organizations

    ChannelResponse:
      type: object
      description: "A subscribed channel of a webhook, with its subscription status and child organization subscription policy."
      properties:
        channelId:
          type: string
          readOnly: true
          description: Unique identifier of this subscribed channel.
          example: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
        channelUri:
          type: string
          readOnly: true
          description: Channel URI.
          example: https://schemas.identity.wso2.org/events/token
        status:
          type: string
          readOnly: true
          enum:
            - SUBSCRIPTION_ACCEPTED
            - SUBSCRIPTION_PENDING
            - SUBSCRIPTION_ERROR
            - UNSUBSCRIPTION_ACCEPTED
            - UNSUBSCRIPTION_PENDING
            - UNSUBSCRIPTION_ERROR
          description: Status of the subscription.
          example: SUBSCRIPTION_ACCEPTED
        childOrgSubscription:
          $ref: '#/components/schemas/ChildOrgSubscription'
    Organization:
      type: object
      required:
        - orgId
      description: "A child organization. Requests only need `orgId`."
      properties:
        orgId:
          type: string
          description: "Organization ID. Child organizations of this organization are not included."
          example: b028ca17-8f89-449c-ae27-fa955e66465d
        orgName:
          type: string
          readOnly: true
          description: Organization name.
          example: sub003
        parentOrgId:
          type: string
          readOnly: true
          description: "ID of the parent organization. The parent might not be in the response if it isn't subscribed or is on another page."
          example: 7c1f9a83-5b2e-41d7-9f30-2ac4e8b16d55

    SubscribedOrganizationList:
      type: object
      description: "Paginated list of the child organizations a channel is subscribed to."
      properties:
        channelUri:
          type: string
          readOnly: true
          description: Channel URI this list belongs to.
          example: https://schemas.identity.wso2.org/events/registration
        subscriptionPolicy:
          type: string
          readOnly: true
          enum:
            - NONE
            - ALL_EXISTING_AND_FUTURE_ORGS
            - SELECTED_ORGS_ONLY
          description: "Child organization subscription policy for the channel."
          example: ALL_EXISTING_AND_FUTURE_ORGS
        totalResults:
          type: integer
          description: "Total number of child organizations subscribed to the channel."
          example: 142
        startIndex:
          type: integer
          description: Index of the first record in this response.
          example: 0
        count:
          type: integer
          description: Number of records returned in this response.
          example: 2
        organizations:
          type: array
          description: "Child organizations on this page."
          items:
            $ref: '#/components/schemas/Organization'

    # =========================================================================
    # Shared
    # =========================================================================
    EventProfile:
      type: object
      required:
        - name
        - uri
      properties:
        name:
          type: string
          description: Webhook Event Profile.
          example: WSO2
        uri:
          type: string
          description: Webhook Event Profile URI.
          example: https://schemas.identity.wso2.org/events

    WebhookSummary:
      type: object
      properties:
        id:
          type: string
          example: 'eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c'
        createdAt:
          type: string
          example: '2024-05-01T12:00:00Z'
        updatedAt:
          type: string
          example: '2024-05-02T12:00:00Z'
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        name:
          type: string
          description: Webhook name.
          example: Login webhook.
        status:
          type: string
          enum:
            - ACTIVE
            - PARTIALLY_ACTIVE
            - INACTIVE
            - PARTIALLY_INACTIVE
          description: Webhook Status.
          example: "ACTIVE"
        self:
          type: string
          example: /t/{tenant-domain}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c

    WebhookList:
      type: object
      properties:
        totalResults:
          type: integer
          description: Total number of webhooks available.
          example: 12
        startIndex:
          type: integer
          description: Index of the first record in this response.
          example: 0
        count:
          type: integer
          description: Number of records returned in this response.
          example: 12
        links:
          type: array
          description: Navigation links. Contains `next` and `previous` where applicable.
          items:
            $ref: '#/components/schemas/Link'
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSummary'

    Link:
      type: object
      properties:
        href:
          type: string
          example: /t/{tenant-domain}/api/server/v2/webhooks?limit=25&offset=25
        rel:
          type: string
          example: next

    Error:
      type: object
      properties:
        code:
          type: string
          example: WEBHOOK-00001
        message:
          type: string
          example: Some error message.
        description:
          type: string
          example: Some error description.
        traceId:
          type: string
          example: e0fbcfeb-3617-43c4-8dd0-7b7d38e13047