openapi: 3.0.0
info:
  title: Customer Data Service API
  description: |
    Manage the profiles, profile attributes, unification rules, consent categories, settings and
    review tasks of an organization in the Customer Data Service (CDS), share profile attributes and
    unification rules with child organizations, and choose the child organizations that use CDS.

    Call the API with an access token issued for the organization, with the `iam-cds` audience and
    the scope each operation names. In a child organization, use the path of the child organization and
    the `internal_org_cds_*` scope of the operation, for example `internal_org_cds_profile_view` for
    `internal_cds_profile_view`.
  version: v1
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://{server-url}/t/{org-handle}/cds/api/v1
  description: An organization.
  variables:
    server-url:
      default: localhost:8900
    org-handle:
      default: carbon.super
- url: https://{server-url}/t/{org-handle}/o/{org-id}/cds/api/v1
  description: A child organization of the organization.
  variables:
    server-url:
      default: localhost:8900
    org-handle:
      default: carbon.super
    org-id:
      default: 9b2e4c71-5d8a-4f3e-a6b0-2c7d1e8f4a95
security:
- bearerAuth: []
paths:
  /profiles:
    get:
      tags:
      - Profile
      summary: Get all profiles
      description: |
        Lists profiles, optionally narrowed by `filter`, by `fuzzyFilter`, or by both.

        `filter` selects profiles whose values satisfy the condition exactly.
        `fuzzyFilter` runs the identity resolution engine instead, returning profiles whose
        values are *similar* to the ones given, each with the score it was given.

        Supplying both is a hybrid search: a profile is returned only where it is similar on
        the `fuzzyFilter` values **and** exactly satisfies every `filter` condition.

        <br><b>Scope required:</b> `internal_cds_profile_view`
      operationId: getAllProfiles
      parameters:
      - name: filter
        in: query
        required: false
        description: |
          An exact condition, written `<key> <operator> <value>`. Repeat the parameter to
          apply more than one condition, or join several in one value with ` and `.

          Operators are `eq` (equals), `co` (contains) and `sw` (starts with).
        schema:
          type: array
          items:
            type: string
        example:
        - traits.city eq Colombo
      - name: fuzzyFilter
        in: query
        required: false
        description: |
          A value to match on similarity rather than equality, written the same way and
          always compared with `eq` — for example `traits.name eq Jonathan Smith`, which
          also matches `Jonathon Smyth`. Repeat the parameter to search on more than one
          attribute.

          How closely two values have to agree is decided by the organization's active
          unification rules: an attribute is only searched where a rule names it, and the
          rule's attribute type selects the comparison. A rule matched exactly contributes
          nothing extra here, so tolerant search needs at least one rule set to `fuzzy`.

          Tolerant matching has to be switched on for the server
          (`identity_resolution.fuzzy_matching_enabled`). While it is off, rules stored as
          fuzzy are read as exact and this parameter returns only exact matches.
        schema:
          type: array
          items:
            type: string
        example:
        - traits.name eq Jonathan Smith
      - name: threshold
        in: query
        required: false
        description: |
          Lowest match score to return. Only applies alongside `fuzzyFilter`. Omitted, or 0
          or less, the `manual_review_threshold` of the organization is used, which is 0.75
          unless the organization changed it. A value above 1 is treated as 1. A value that
          is not a number gives a 400.
        schema:
          type: number
          format: double
        example: 0.75
      - name: page_size
        in: query
        required: false
        description: |
          Maximum number of profiles to return. Defaults to 5. A value above 200 is treated
          as 200, and 0 returns an empty page. A value that is not a whole number, or is
          negative, gives a 400.
        schema:
          type: integer
          minimum: 0
          default: 5
      - name: cursor
        in: query
        required: false
        description: |
          Opaque cursor from `next_cursor` or `previous_cursor` of a previous page. Used
          with or without `filter`. Ignored by a `fuzzyFilter` search. An invalid cursor
          gives a 400.
        schema:
          type: string
      - name: attributes
        in: query
        required: false
        description: |
          Comma-separated list of the fields to return in each profile, for example
          `traits.city,identity_attributes`. A name with a dot selects one attribute of a
          scope; a scope alone selects all of its attributes. Omitted, each profile in the
          list carries only `profile_id`, `user_id`, `meta` and `merged_from`.
        schema:
          type: string
        example: traits.city,identity_attributes
      responses:
        '200':
          description: |
            A page of profiles. Where `fuzzyFilter` was supplied each profile also carries
            `match_score` and `score_breakdown`, highest score first, and `pagination`
            holds only `count` and `page_size`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListAPIResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Profile
      summary: Create a profile
      description: |
        Creates a profile and sets the `cds_profile` cookie that tracks it as an anonymous
        profile.
        If the request carries a `cds_profile` cookie that belongs to an active profile, no
        profile is created and the existing profile is returned with a 200.

        Fields that are not part of the request schema are rejected with a 400.

        <br><b>Scope required:</b> `internal_cds_profile_create`
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: A valid `cds_profile` cookie was sent, so the existing profile is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '201':
          description: Profile created.
          headers:
            Location:
              description: URL of the new profile.
              schema:
                type: string
            Set-Cookie:
              description: The `cds_profile` cookie (HttpOnly) that identifies the anonymous profile.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profiles/link:
    post:
      tags:
      - Profile
      summary: Link an anonymous profile to a user
      description: |
        Sets the `user_id` of an anonymous profile.
        The call is idempotent: linking a profile to the user it is already linked to returns
        a 200 with no change.

        <br><b>Scope required:</b> `internal_cds_profile_link`
      operationId: linkProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileLinkRequest'
      responses:
        '200':
          description: Profile linked successfully, or it was already linked to this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLinkResponse'
        '400':
          description: |
            Bad Request. The body is invalid, `profile_id` or `user_id` is missing, or CDS is not
            enabled for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '409':
          description: Conflict. The profile is already linked to a different user (`PROFILE_ALREADY_LINKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profiles/{profileId}:
    parameters:
    - $ref: '#/components/parameters/ProfileId'
    get:
      tags:
      - Profile
      summary: Retrieve profile by Id
      description: |
        Unless the calling application is listed in `system_applications`, the profile is filtered by
        consent: only
        the attributes covered by a consent the profile has given are returned. Use
        `consentCategoryId` to limit this to specific consent categories.

        <br><b>Scope required:</b> `internal_cds_profile_view`
      operationId: getProfile
      parameters:
      - name: includeApplicationData
        in: query
        required: false
        description: |
          Whether to include `application_data` in the response. Omitted, it is not
          returned. An application not listed in `system_applications` only ever gets the data
          of its own application.
        schema:
          type: boolean
          default: false
      - name: application_identifier
        in: query
        required: false
        description: |
          Application identifiers whose `application_data` is returned, comma-separated or
          repeated. Use `*` for all applications.
        schema:
          type: string
        example: app-1,app-2
      - name: consentCategoryId
        in: query
        required: false
        description: |
          Consent categories to filter the response by, comma-separated or repeated. Not used
          for an application listed in `system_applications`.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Profile
      summary: Update profile by Id
      description: |
        Partially updates a profile.
        `identity_attributes`, `traits` and `application_data` in the body are deep merged
        into the existing values. If the profile has been merged into another profile, the
        patch is applied to that profile's data.

        <br><b>Scope required:</b> `internal_cds_profile_update`
      operationId: patchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Profile
      summary: Delete profile by Id
      description: |
        <b>Scope required:</b> `internal_cds_profile_delete`
      operationId: deleteProfile
      responses:
        '204':
          description: Profile deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profiles/{profileId}/consents:
    parameters:
    - $ref: '#/components/parameters/ProfileId'
    get:
      tags:
      - Profile
      summary: Get the consents of a profile
      description: |
        <b>Scope required:</b> `internal_cds_profile_view`
      operationId: getProfileConsents
      responses:
        '200':
          description: The consent records of the profile.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Profile
      summary: Update the consents of a profile
      description: |
        <b>Scope required:</b> `internal_cds_profile_update`
      operationId: updateProfileConsents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ConsentRecord'
      responses:
        '200':
          description: Consents updated. The body echoes the records that were sent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecord'
        '400':
          description: |
            Bad Request. The body is not a valid array of consent records (this response can have
            a plain text body), or CDS is not enabled for the organization.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile-schema:
    get:
      tags:
      - Profile Schema
      summary: Get the whole profile schema
      description: |
        <b>Scope required:</b> `internal_cds_profile_schema_view`
      operationId: getProfileSchema
      responses:
        '200':
          description: The profile schema of the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Profile Schema
      summary: Delete the whole profile schema
      description: |
        <b>Scope required:</b> `internal_cds_profile_schema_delete`
      operationId: deleteProfileSchema
      responses:
        '204':
          description: Profile schema deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile-schema/{scope}:
    parameters:
    - $ref: '#/components/parameters/Scope'
    get:
      tags:
      - Profile Schema
      summary: Get the schema attributes of a scope
      description: |
        <b>Scope required:</b> `internal_cds_profile_schema_view`
      operationId: getProfileSchemaForScope
      parameters:
      - name: filter
        in: query
        required: false
        description: |
          A condition, written `<key> <operator> <value>`, for example
          `application_identifier eq app-1`. Repeat the parameter, or join conditions with
          ` and `. The keys are `attribute_name` and `application_identifier`.
        schema:
          type: array
          items:
            type: string
        example:
        - application_identifier eq app-1
      responses:
        '200':
          description: |
            The attributes of the scope. For `identity_attributes` and `traits` the body is an
            array. For `application_data` it is an object that holds the attributes of each
            application under the application identifier, for all applications unless a filter
            narrows them.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ProfileSchemaAttribute'
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Profile Schema
      summary: Add schema attributes to a scope
      description: |
        The body is an **array**, so one call can add
        several attributes. Fields that are not part of the attribute schema are rejected.

        The call returns a 400 when the array is empty, when the scope is `identity_attributes`
        (those are managed in the identity provider), or when an attribute sets
        `application_identifier` in a scope other than `application_data`.

        `attribute_id` is generated when omitted, and `mutability` defaults to `readWrite`.

        <br><b>Scope required:</b> `internal_cds_profile_schema_create`
      operationId: addProfileSchemaAttributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ProfileSchemaAttribute'
      responses:
        '201':
          description: The attributes that were created.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          description: |
            Bad Request. The body is invalid or empty, the scope is `identity_attributes` or not
            a valid scope, or `application_identifier` is used outside `application_data`. This
            response uses either form of error body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict. An attribute conflicts with one that already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Profile Schema
      summary: Delete all schema attributes of a scope
      description: |
        Not allowed for `identity_attributes`, which
        returns a 405.

        <br><b>Scope required:</b> `internal_cds_profile_schema_delete`
      operationId: deleteProfileSchemaForScope
      responses:
        '204':
          description: Attributes deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Method Not Allowed. The scope is `identity_attributes`, whose attributes are managed
            in the identity provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile-schema/{scope}/{attrID}:
    parameters:
    - $ref: '#/components/parameters/Scope'
    - $ref: '#/components/parameters/AttributeId'
    get:
      tags:
      - Profile Schema
      summary: Get a schema attribute
      description: |
        <b>Scope required:</b> `internal_cds_profile_schema_view`
      operationId: getProfileSchemaAttribute
      responses:
        '200':
          description: The attribute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Profile Schema
      summary: Update a schema attribute
      description: |
        Despite the method, this is a **partial
        update**: only the fields in the body change. The body is any JSON object of attribute
        fields.

        Not allowed for `identity_attributes`, which returns a 400.

        <br><b>Scope required:</b> `internal_cds_profile_schema_update`
      operationId: updateProfileSchemaAttribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The attribute fields to change.
              example:
                display_name: Preferred city
      responses:
        '200':
          description: The attribute after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSchemaAttribute'
        '400':
          description: |
            Bad Request. The body is not valid (this response can have a plain text body), the
            scope is `identity_attributes` or not a valid scope, or CDS is not enabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Profile Schema
      summary: Delete a schema attribute
      description: |
        The call is idempotent: deleting an attribute that does not exist also returns a 204.
        A shared or inherited attribute is read-only and gives a 403. An attribute that is a
        sub-attribute of another attribute cannot be deleted until it is removed from its
        parent, which gives a 400.

        <br><b>Scope required:</b> `internal_cds_profile_schema_delete`
      operationId: deleteProfileSchemaAttribute
      responses:
        '204':
          description: Attribute deleted, or it did not exist.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile-schema/{scope}/{attrID}/sharing-policies:
    parameters:
    - $ref: '#/components/parameters/Scope'
    - $ref: '#/components/parameters/AttributeId'
    post:
      tags:
      - Sharing
      summary: Share a profile schema attribute with child organizations
      description: |
        Only the organization that owns the attribute can share it. Identity attributes cannot be
        shared. A complex attribute is shared as one unit: its sub-attributes follow the sharing
        policies of the parent, and a sub-attribute cannot be shared alone. An organization has a
        maximum of one policy for each attribute.

        <br><b>Scope required:</b> `internal_cds_profile_schema_share_update`
      operationId: createSchemaAttributeSharingPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyRequest'
      responses:
        '201':
          description: Sharing policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Sharing
      summary: List the sharing policies of a profile schema attribute
      description: |
        <b>Scope required:</b> `internal_cds_profile_schema_share_view`
      operationId: listSchemaAttributeSharingPolicies
      responses:
        '200':
          description: Sharing policies retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile-schema/{scope}/{attrID}/sharing-policies/{policyId}:
    parameters:
    - $ref: '#/components/parameters/Scope'
    - $ref: '#/components/parameters/AttributeId'
    - $ref: '#/components/parameters/PolicyId'
    get:
      tags:
      - Sharing
      summary: Get a sharing policy of a profile schema attribute
      description: |
        <b>Scope required:</b> `internal_cds_profile_schema_share_view`
      operationId: getSchemaAttributeSharingPolicy
      responses:
        '200':
          description: Sharing policy retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Sharing
      summary: Replace the target organizations of a sharing policy
      description: |
        <b>Scope required:</b> `internal_cds_profile_schema_share_update`
      operationId: updateSchemaAttributeSharingPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyRequest'
      responses:
        '200':
          description: Sharing policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
