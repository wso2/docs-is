components:
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
    Scope:
      name: scope
      in: path
      required: true
      schema:
        type: string
        enum:
        - identity_attributes
        - traits
        - application_data
    AttributeId:
      name: attrID
      in: path
      required: true
      schema:
        type: string
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequestAnyFormat:
      description: |
        Bad Request. Invalid request, or CDS is not enabled for the organization. The body is an
        `Error` or a `LegacyError`, depending on which check refused the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnyError'
    InternalServerError:
      description: Internal Server Error. The server failed to process the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
    ProfileNotFound:
      description: Not Found. The profile does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: |
        Bad Request. Invalid request, CDS is not enabled for the organization, or, on the
        organization endpoints, a child organization called an endpoint that only a primary
        organization can use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized. The credentials are missing or not valid for the organization of the
        path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Forbidden. The token does not have the scope the operation requires, a child
        organization tried to write, or the resource is shared from a parent organization and
        is read-only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found. The resource, the policy, or the organization does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict. The organization already has a policy for the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Pagination:
      type: object
      required:
      - count
      - page_size
      properties:
        count:
          type: integer
          description: Number of items in this page.
        page_size:
          type: integer
        next_cursor:
          type: string
          description: Cursor for the next page. Omitted on the last page.
        previous_cursor:
          type: string
          description: Cursor for the previous page. Omitted on the first page.
    ProfileListAPIResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileListResponse'
    ProfileListResponse:
      type: object
      required:
      - profile_id
      - meta
      description: |
        A profile as listed by `GET /profiles`. Unlike `ProfileResponse` it has no
        `anonymous_profile_tracker` or `merged_to`. `match_score` and `score_breakdown`
        appear only on a `fuzzyFilter` search.
      properties:
        profile_id:
          type: string
          example: e8bf7337-4049-4d92-9545-711894ab2af3
        user_id:
          type: string
          description: User the profile is linked to. Omitted for anonymous profiles.
          example: 40497337-e8bf-4d92-9545-711894ab2af3
        meta:
          $ref: '#/components/schemas/ProfileMeta'
        identity_attributes:
          type: object
          additionalProperties: true
          example:
            email: random@work.com
        traits:
          type: object
          additionalProperties: true
          example:
            shopper: 'true'
        application_data:
          type: object
          description: Application specific data, keyed by application identifier.
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            app-1:
              theme: dark
        merged_from:
          type: array
          items:
            $ref: '#/components/schemas/ProfileReference'
        match_score:
          type: number
          format: double
          description: |
            How alike the profile and the supplied values were judged to be, between 0 and 1.
            It is the score of the highest-priority rule that agreed, not a combination of
            every rule, so a rule in the breakdown can score higher than this. It is not
            lowered when another rule disagrees: that decides whether profiles merge
            unattended, not how alike they are.
          example: 0.9429
        score_breakdown:
          type: object
          description: Each rule that had something to compare, and what it scored.
          additionalProperties:
            type: number
            format: double
          example:
            name: 0.9429
            city: 1.0
    ProfileResponse:
      type: object
      required:
      - profile_id
      - meta
      properties:
        profile_id:
          type: string
          example: e8bf7337-4049-4d92-9545-711894ab2af3
        user_id:
          type: string
          description: User the profile is linked to. Omitted for anonymous profiles.
          example: 40497337-e8bf-4d92-9545-711894ab2af3
        anonymous_profile_tracker:
          type: string
          description: Identifier tracking an anonymous profile. Omitted when not set.
        meta:
          $ref: '#/components/schemas/ProfileMeta'
        identity_attributes:
          type: object
          additionalProperties: true
          example:
            email: random@work.com
        traits:
          type: object
          additionalProperties: true
          example:
            shopper: 'true'
        application_data:
          type: object
          description: Application specific data, keyed by application identifier.
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            app-1:
              theme: dark
        merged_to:
          $ref: '#/components/schemas/ProfileReference'
        merged_from:
          type: array
          items:
            $ref: '#/components/schemas/ProfileReference'
    ProfileMeta:
      type: object
      required:
      - created_at
      - updated_at
      - location
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        location:
          type: string
    ProfileReference:
      type: object
      description: Reference to another profile involved in a merge.
      properties:
        profile_id:
          type: string
        reason:
          type: string
          description: Reason the profiles were merged, for example the unification rule name.
    ProfileRequest:
      type: object
      description: Fields that are not listed here are rejected.
      properties:
        user_id:
          type: string
          description: User to link the profile to. Leave out for an anonymous profile.
          example: 40497337-e8bf-4d92-9545-711894ab2af3
        identity_attributes:
          type: object
          additionalProperties: true
          example:
            email: random@work.com
        traits:
          type: object
          additionalProperties: true
          example:
            shopper: 'true'
        application_data:
          type: object
          description: Application specific data, keyed by application identifier.
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            app-1:
              theme: dark
    ProfilePatchRequest:
      type: object
      description: |
        The parts of the profile to change. Each of the three objects is deep merged into the
        existing value.
      properties:
        identity_attributes:
          type: object
          additionalProperties: true
        traits:
          type: object
          additionalProperties: true
        application_data:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
      example:
        traits:
          city: Colombo
    ConsentRecord:
      type: object
      properties:
        category_identifier:
          type: string
          description: The `category_identifier` of the consent category.
        is_consented:
          type: boolean
        consented_at:
          type: string
          format: date-time
    ProfileLinkRequest:
      type: object
      properties:
        profile_id:
          type: string
          example: e8bf7337-4049-4d92-9545-711894ab2af3
        user_id:
          type: string
          example: 40497337-e8bf-4d92-9545-711894ab2af3
      required:
      - profile_id
      - user_id
    ProfileLinkResponse:
      type: object
      required:
      - profile_id
      - user_id
      properties:
        profile_id:
          type: string
          example: e8bf7337-4049-4d92-9545-711894ab2af3
        user_id:
          type: string
          example: 40497337-e8bf-4d92-9545-711894ab2af3
    UnificationRuleRequest:
      type: object
      description: Fields that are not listed here are rejected.
      required:
      - rule_name
      - property_name
      - priority
      - is_active
      properties:
        rule_name:
          type: string
          description: Descriptive name for the rule
          example: email based
        property_name:
          type: string
          description: |
            Path of the profile attribute to unify on. The attribute has to be in the profile
            schema and cannot be complex. `user_id`, `identity_attributes.user_id` and
            `application_data.*` attributes are not allowed.
          example: identity_attributes.email
        priority:
          type: integer
          description: Priority of the rule (lower number = higher priority)
          example: 1
        is_active:
          type: boolean
          description: Whether the rule is currently active
          example: true
        attribute_type:
          $ref: '#/components/schemas/UnificationAttributeType'
        unification_method:
          $ref: '#/components/schemas/UnificationMethod'
        match_strength:
          $ref: '#/components/schemas/MatchStrength'
        mismatch_strength:
          $ref: '#/components/schemas/MismatchStrength'
    UnificationRule:
      type: object
      required:
      - rule_id
      - rule_name
      - property_name
      - priority
      - is_active
      - attribute_type
      - unification_method
      properties:
        rule_id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the resolution rule
          example: 5af4235d-b95e-4b5b-9429-c9021e653361
        rule_name:
          type: string
          description: Descriptive name for the rule
          example: email based
        property_name:
          type: string
          description: Path of the profile attribute the rule unifies on.
          example: identity_attributes.email
        priority:
          type: integer
          description: Priority of the rule (lower number = higher priority)
          example: 1
        is_active:
          type: boolean
          description: Whether the rule is currently active
          example: true
        attribute_type:
          $ref: '#/components/schemas/UnificationAttributeType'
        unification_method:
          $ref: '#/components/schemas/UnificationMethod'
        match_strength:
          $ref: '#/components/schemas/MatchStrength'
        mismatch_strength:
          $ref: '#/components/schemas/MismatchStrength'
        origin:
          type: string
          readOnly: true
          enum:
          - OWNED
          - SHARED
          description: SHARED for a rule that a parent organization shares with this organization.
    UnificationRulePatch:
      type: object
      description: |
        Fields that are not listed here are rejected. `rule_name` and `property_name` cannot be
        changed.
      properties:
        priority:
          type: integer
          description: Priority of the rule (lower number = higher priority)
          example: 1
        is_active:
          type: boolean
          description: Whether the rule is currently active
          example: true
        attribute_type:
          $ref: '#/components/schemas/UnificationAttributeType'
        unification_method:
          $ref: '#/components/schemas/UnificationMethod'
        match_strength:
          $ref: '#/components/schemas/MatchStrength'
        mismatch_strength:
          $ref: '#/components/schemas/MismatchStrength'
    UnificationAttributeType:
      type: string
      description: |
        What kind of value the attribute holds. Determines which comparison is applied
        and which blocking keys are indexed.

        Optional. Omitted, it defaults to `PRIMITIVE_EXACT`, which is how a rule written
        before typed matching is read. It is **required when `unification_method` is
        `fuzzy`**, because it selects how two values are compared and there is nothing
        sensible to assume.

        It still shapes behaviour under `deterministic`: `DATE` and `UNIQUE_ID` are
        normalized before comparing, so a date written two ways still matches, and the
        type seeds the evidence strengths.
      enum:
      - PRIMITIVE_EXACT
      - FUZZY_STRING
      - NAME
      - EMAIL
      - PHONE
      - LOCATION
      - DATE
      - UNIQUE_ID
      example: EMAIL
    UnificationMethod:
      type: string
      description: |
        Whether this rule matches on exact equality or tolerates variation. Rules of
        both kinds are evaluated side by side within a single comparison. Only
        FUZZY_STRING, NAME, EMAIL, PHONE and LOCATION support `fuzzy`.

        Optional. Omitted, it defaults to `deterministic`. `fuzzy` is refused while the server
        has `identity_resolution.fuzzy_matching_enabled` turned off.
      enum:
      - deterministic
      - fuzzy
      example: deterministic
    MatchStrength:
      type: string
      description: |
        How much an agreement on this attribute supports a merge. HIGH means the
        attribute identifies a person well enough to merge on it alone; MEDIUM and LOW
        require a second agreeing rule.

        Present only on a server that sets
        `identity_resolution.allow_evidence_strength_override`, which is off by default.
        Elsewhere sending it is rejected with a 400 and it is never returned, because the
        value is derived from `attribute_type` and no caller can change it.

        Where the setting is on, an absent field means the rule inherits the strength
        its `attribute_type` implies; a present one is a deliberate override.
      enum:
      - HIGH
      - MEDIUM
      - LOW
      example: HIGH
    MismatchStrength:
      type: string
      description: |
        How much a disagreement on this attribute opposes a merge. HIGH makes the
        attribute discriminating: two present, differing values veto an automatic merge
        whatever else agrees. Independent of `match_strength`, because the two
        directions rarely carry equal weight — matching emails strongly imply the same
        person while differing emails imply little, and a date of birth is the reverse.

        Gated and reported exactly as `match_strength`.
      enum:
      - HIGH
      - MEDIUM
      - LOW
      example: LOW
    UnificationOptionsResponse:
      type: object
      properties:
        attribute_types:
          type: array
          items:
            type: object
            properties:
              value:
                $ref: '#/components/schemas/UnificationAttributeType'
              label:
                type: string
                example: Email Address
              allowed_methods:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      $ref: '#/components/schemas/UnificationMethod'
                    label:
                      type: string
                      example: Deterministic (Exact)
    ConsentAttribute:
      type: object
      required:
      - attribute_name
      properties:
        attribute_name:
          type: string
          description: Name of the profile attribute the category covers.
          example: traits.age
        application_identifier:
          type: string
          description: Application the attribute belongs to. Only for `application_data` attributes.
          example: crm_app
        scope:
          type: string
          readOnly: true
          description: Scope of the attribute. Derived from the profile schema, never sent.
        attribute_id:
          type: string
          readOnly: true
          description: Schema attribute ID. Derived from the profile schema, never sent.
    ConsentCategoryRequest:
      type: object
      required:
      - category_name
      - purpose
      properties:
        category_name:
          type: string
          example: User behavior analytics
        purpose:
          type: string
          enum:
          - profiling
          - personalization
          - destination
        destinations:
          type: array
          items:
            type: string
        attributes:
          type: array
          description: The profile attributes the category covers.
          items:
            $ref: '#/components/schemas/ConsentAttribute'
    ConsentCategory:
      type: object
      required:
      - category_name
      - category_identifier
      - purpose
      - is_mandatory
      properties:
        category_name:
          type: string
          example: User behavior analytics
        category_identifier:
          type: string
          format: uuid
          readOnly: true
          description: Generated by the server.
          example: 7fa06d1e-688f-481b-8263-29c1f5ce1493
        purpose:
          type: string
          enum:
          - profiling
          - personalization
          - destination
        destinations:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ConsentAttribute'
        is_mandatory:
          type: boolean
          readOnly: true
          description: True for a category that the system manages. It cannot be changed or deleted.
    ProfileSchemaAttribute:
      type: object
      required:
      - attribute_name
      - value_type
      - merge_strategy
      description: Fields that are not listed here are rejected when attributes are added.
      properties:
        attribute_id:
          type: string
          description: Generated when omitted.
        attribute_name:
          type: string
          description: Name of the attribute, for example `traits.city`.
          example: traits.city
        scope:
          type: string
          enum:
          - identity_attributes
          - traits
          - application_data
        display_name:
          type: string
        value_type:
          type: string
          enum:
          - string
          - integer
          - decimal
          - boolean
          - date_time
          - date
          - complex
          - epoch
        merge_strategy:
          type: string
          description: How the value is resolved when two profiles merge.
          enum:
          - overwrite
          - combine
        mutability:
          type: string
          description: Defaults to `readWrite`.
          enum:
          - readWrite
          - readOnly
          - writeOnly
          - immutable
          - writeOnce
        application_identifier:
          type: string
          description: Application the attribute belongs to. Only for `application_data`.
        multi_valued:
          type: boolean
          description: True when the value is an array of `value_type`.
        canonical_values:
          type: array
          description: The values the attribute may take.
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
        sub_attributes:
          type: array
          description: The attributes of a `complex` attribute.
          items:
            type: object
            required:
            - attribute_id
            - attribute_name
            properties:
              attribute_id:
                type: string
              attribute_name:
                type: string
        scim_dialect:
          type: string
        origin:
          type: string
          readOnly: true
          enum:
          - OWNED
          - SHARED
          - INHERITED
          description: |
            Set only on reads of the effective schema. SHARED for an attribute that a parent
            organization shares, INHERITED for an identity attribute that the organization
            inherits.
    ProfileSchema:
      type: object
      description: The effective profile schema of the organization.
      properties:
        profile_id:
          type: object
          additionalProperties:
            type: string
          description: Core definition of `profile_id`, for example its value type and mutability.
          example:
            value_type: string
            mutability: immutable
        user_id:
          type: object
          additionalProperties:
            type: string
          example:
            value_type: string
            mutability: writeOnce
        meta:
          type: object
          description: Core definitions of the `meta` fields, keyed by field name.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        identity_attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSchemaAttribute'
        traits:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSchemaAttribute'
        application_data:
          type: object
          description: Attributes of each application, keyed by application identifier.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ProfileSchemaAttribute'
    AdminConfig:
      type: object
      required:
      - cds_enabled
      - auto_merge_enabled
      - auto_merge_threshold
      - manual_review_threshold
      - deterministic_match_decisive
      properties:
        cds_enabled:
          type: boolean
        system_applications:
          type: array
          description: Applications whose reads are not filtered by consent.
          items:
            type: string
        auto_merge_enabled:
          type: boolean
        auto_merge_threshold:
          type: number
          format: double
          description: Lowest match score that merges two profiles automatically.
        manual_review_threshold:
          type: number
          format: double
          description: Lowest match score that raises a review task.
        deterministic_match_decisive:
          type: boolean
          description: |
            When true, a pair that agrees on any deterministic rule merges without the other
            rules being consulted. When false, the other rules may object and send the pair to
            review.
        cors_allowed_origins:
          type: array
          description: Browser origins allowed to call the organization's endpoints. When empty, the deployment-wide
            list applies.
          items:
            type: string
        temporary_profile_retention_days:
          type: integer
          format: int32
          minimum: 1
          description: Number of days a temporary profile may go without an update before it is deleted,
            together with its cookies. An organization that has not set it gets the default of 90 days.
            Profiles that have a user_id, or that are merged with another profile, are never deleted by
            this setting.
        temporary_profile_cleanup_interval_days:
          type: integer
          format: int32
          minimum: 1
          description: Days between two cleanups of the temporary profiles of the organization. The default
            is 30.
    AdminConfigUpdate:
      type: object
      description: Fields that are not listed here are rejected. Only the fields that are sent change.
      properties:
        cds_enabled:
          type: boolean
        system_applications:
          type: array
          items:
            type: string
        auto_merge_enabled:
          type: boolean
        auto_merge_threshold:
          type: number
          format: double
        manual_review_threshold:
          type: number
          format: double
        deterministic_match_decisive:
          type: boolean
        cors_allowed_origins:
          type: array
          items:
            type: string
        temporary_profile_retention_days:
          type: integer
          format: int32
          minimum: 1
          description: Days a temporary profile may go without an update before it is deleted. Values
            below 1, or above 2147483647, are rejected.
        temporary_profile_cleanup_interval_days:
          type: integer
          format: int32
          minimum: 1
          description: Days between two cleanups of the temporary profiles of the organization. Values
            below 1, or above 2147483647, are rejected.
    ReviewTask:
      type: object
      required:
      - id
      - incoming_profile_id
      - candidate_profile_id
      - status
      - created_at
      properties:
        id:
          type: string
        incoming_profile_id:
          type: string
        candidate_profile_id:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CANCELLED
        score_breakdown:
          type: object
          description: What each rule that had something to compare scored.
          additionalProperties:
            type: number
            format: double
        explanation:
          $ref: '#/components/schemas/MatchExplanation'
        created_at:
          type: string
        resolved_at:
          type: string
        resolved_by:
          type: string
        notes:
          type: string
    MatchExplanation:
      type: object
      description: Absent on a task raised before explanations were recorded.
      properties:
        rules:
          type: array
          description: What each rule found for the pair.
          items:
            type: object
            properties:
              rule_id:
                type: string
              rule_name:
                type: string
              property_name:
                type: string
              attribute_type:
                type: string
              unification_method:
                type: string
              priority:
                type: integer
              match_strength:
                type: string
              mismatch_strength:
                type: string
              score:
                type: number
                format: double
                description: Absent when either profile lacked the value.
              verdict:
                type: string
                description: |
                  The rule's reading of the pair. AGREE: both values present and similar enough to
                  support the match. DISAGREE: both present and clearly different. INCONCLUSIVE:
                  both present, with a similarity that neither supports nor opposes the match.
                  UNKNOWN: at least one profile has no value.
                enum:
                - AGREE
                - INCONCLUSIVE
                - DISAGREE
                - UNKNOWN
              primary:
                type: boolean
                description: True for the highest-priority rule that agreed.
        reasons:
          type: array
          description: Why the pair was held for review.
          items:
            type: object
            properties:
              code:
                type: string
                description: |
                  For example `BELOW_AUTO_MERGE_THRESHOLD`, `DISCRIMINATING_MISMATCH`,
                  `CONFLICTING_EVIDENCE`, `WEAK_SOLE_EVIDENCE`, `COMMON_VALUE`,
                  `AUTO_MERGE_DISABLED`, `REJECTION_RECONSIDERED`, `AUTO_MERGE_FAILED` or
                  `MERGED_WITH_ANOTHER_PROFILE`.
              rule_ids:
                type: array
                items:
                  type: string
    ReviewTaskList:
      type: object
      required:
      - pagination
      - tasks
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTask'
    ReviewResolveRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        notes:
          type: string
    Error:
      type: object
      description: |
        The error body of most client errors (4xx).

        The service writes client errors in two shapes. This one, with `code`, `message` and
        `description`, is used by most endpoints. Some checks use `LegacyError` instead; the
        operations that can return either say so.
      properties:
        code:
          type: string
          description: Error code, prefixed `CDS-`.
          example: CDS-00000
        message:
          type: string
          example: Some Error Message
        description:
          type: string
          example: Some Error Description
    LegacyError:
      type: object
      description: |
        The other shape of a client error, with the keys prefixed `error_`. It is written by the
        validation of unification rules, by adding profile schema attributes, and by a few
        other checks.
      properties:
        error_code:
          type: string
          example: CDS-00000
        error_message:
          type: string
          example: Some Error Message
        error_description:
          type: string
          example: Some Error Description
    AnyError:
      description: An `Error` or a `LegacyError`.
      oneOf:
      - $ref: '#/components/schemas/Error'
      - $ref: '#/components/schemas/LegacyError'
    ServerError:
      type: object
      description: The body of a server error (500). It never says what failed.
      properties:
        error:
          type: string
          example: Internal server error
    ChildOrg:
      type: object
      required:
      - org_id
      - reach
      properties:
        org_id:
          type: string
          description: A direct child of the initiating organization. The organization must be active.
          example: 9b2e4c71-5d8a-4f3e-a6b0-2c7d1e8f4a95
        reach:
          type: string
          enum:
          - org
          - subtree
          description: 'org: the organization only. subtree: the organization and all current and future
            organizations below it.'
    ChildOrgs:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - all
          - selected
          description: 'all: all current and future organizations below the initiating organization. selected:
            the organizations in orgs.'
        orgs:
          type: array
          description: Required with mode selected. Must be empty with mode all. Each organization once.
          items:
            $ref: '#/components/schemas/ChildOrg'
    SharingPolicyRequest:
      type: object
      additionalProperties: false
      required:
      - child_orgs
      properties:
        child_orgs:
          $ref: '#/components/schemas/ChildOrgs'
      example:
        child_orgs:
          mode: selected
          orgs:
          - org_id: 9b2e4c71-5d8a-4f3e-a6b0-2c7d1e8f4a95
            reach: subtree
    SharingPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum:
          - SCHEMA_ATTRIBUTE
          - UNIFICATION_RULE
        resource_id:
          type: string
        owning_org_id:
          type: string
        initiating_org_id:
          type: string
        child_orgs:
          $ref: '#/components/schemas/ChildOrgs'
    SharingPolicyList:
      type: object
      properties:
        total_results:
          type: integer
        policies:
          type: array
          items:
            $ref: '#/components/schemas/SharingPolicy'
    OrganizationAccessPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owning_org_id:
          type: string
        initiating_org_id:
          type: string
        child_orgs:
          $ref: '#/components/schemas/ChildOrgs'
    OrganizationAccessPolicyList:
      type: object
      properties:
        total_results:
          type: integer
        policies:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationAccessPolicy'
    OrganizationSyncStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - NOT_SYNCED
          - SYNCING
          - SYNCED
          - FAILED
        started_at:
          type: string
          format: date-time
          description: The start of the last sync.
        finished_at:
          type: string
          format: date-time
          description: The end of the last sync. Not set while a sync runs.
        last_synced_at:
          type: string
          format: date-time
          description: The end of the last sync that completed. A later failed sync keeps it.
        error:
          type: string
          description: The error of a failed sync.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An access token issued for the organization of the path, with the `iam-cds` audience. Either a
        JWT or an opaque token. It must carry the scope the operation names.
