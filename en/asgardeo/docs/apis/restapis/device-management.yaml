openapi: 3.0.0
info:
  version: "1.0.0"
  title: 'WSO2 Identity Platform - Device Management API'
  description: 'This document specifies a RESTful API for WSO2 Identity Platform Device Management'
  contact:
    name: WSO2
    url: 'https://wso2.com/identity-and-access-management/'
    email: architecture@wso2.org
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: 'https://api.asgardeo.io/t/{organization-name}/api/server/v1'
security:
  - OAuth2: []
paths:
  /devices:
    get:
      tags:
        - Device Management
      summary: List all registered devices in the organization.
      operationId: listDevices
      description: "This API provides the capability to list a paginated set of registered devices for the organization.\n\n
        <b>Scope (Permission) required:</b> ``internal_device_mgt_view``\n\n"
      parameters:
        - name: limit
          in: query
          description: Maximum number of records to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: offset
          in: query
          description: Number of records to skip for pagination.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: userId
          in: query
          description: Filter devices by the ID of the user who registered them. Returns devices of any status. Pagination applies as usual.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{device-id}:
    get:
      tags:
        - Device Management
      summary: Get a registered device by ID.
      operationId: getDevice
      description: "This API provides the capability to retrieve a registered device by its ID.\n\n
        <b>Scope (Permission) required:</b> ``internal_device_mgt_view``\n\n"
      parameters:
        - name: device-id
          in: path
          description: UUID of the registered device
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Device Management
      summary: Rename a registered device.
      operationId: updateDeviceName
      description: "This API provides the capability to update the display name of a registered device.\n\n
        <b>Scope (Permission) required:</b> ``internal_device_mgt_update``\n\n"
      parameters:
        - name: device-id
          in: path
          description: UUID of the registered device
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Device Management
      summary: Delete a registered device.
      operationId: deleteDevice
      description: "This API provides the capability to delete a registered device by its ID.\n\n
        <b>Scope (Permission) required:</b> ``internal_device_mgt_delete``\n\n"
      parameters:
        - name: device-id
          in: path
          description: UUID of the registered device
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successfully Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://api.asgardeo.io/t/{org-name}/oauth2/authorize'
          tokenUrl: 'https://api.asgardeo.io/t/{org-name}/oauth2/token'
          scopes:
            read: internal_device_mgt_view
            write: internal_device_mgt_update
            delete: internal_device_mgt_delete
  schemas:
    DeviceListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation.
          example: 42
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1.
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page.
          example: 10
        devices:
          type: array
          description: Page of registered devices.
          items:
            $ref: '#/components/schemas/DeviceResponse'
        links:
          type: array
          description: Pagination links (next/previous).
          items:
            $ref: '#/components/schemas/DeviceListLink'
    DeviceListLink:
      type: object
      properties:
        href:
          type: string
          description: Relative URL to the linked page.
          example: "/t/{organization-name}/api/server/v1/devices?offset=10&limit=10"
        rel:
          type: string
          description: Relation to the current page.
          example: "next"
    DeviceResponse:
      type: object
      properties:
        id:
          type: string
          description: The device UUID.
          example: "74070bae-df8c-42bf-8754-5173c237c936"
        deviceName:
          type: string
          description: The display name of the device.
          example: "My iPhone"
        deviceModel:
          type: string
          description: The hardware model of the device.
          example: "iPhone 15 Pro"
        status:
          type: string
          description: The current device status.
          example: "ACTIVE"
        registeredAt:
          type: string
          description: The timestamp when the device was registered, in ISO-8601 format.
          example: "2026-04-27T10:00:00.000Z"
    DevicePatchRequest:
      type: object
      required:
        - deviceName
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 255
          description: The new display name for the device.
          example: "My Work Phone"
    Error:
      type: object
      properties:
        code:
          type: string
          example: DM-60001
        message:
          type: string
          example: Some Error Message.
        description:
          type: string
          example: Some Error Description.
        traceId:
          type: string
          example: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"
