components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://api.asgardeo.io/t/{org-name}/oauth2/authorize'
          tokenUrl: 'https://api.asgardeo.io/t/{org-name}/oauth2/token'
          scopes:
            internal_webhook_view: View webhooks
            internal_webhook_create: Create webhooks
            internal_webhook_update: Update webhooks
            internal_webhook_delete: Delete webhooks

  parameters:
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Unique identifier of the webhook.
      schema:
        type: string

    ChannelId:
      name: channelId
      in: path
      required: true
      description: >
        Unique identifier of the subscribed channel, returned as `channelId` on each entry
        in `subscribedChannels`.
      schema:
        type: string

  schemas:
    # =========================================================================
    # Webhook — create
    # =========================================================================
    WebhookCreateRequest:
      type: object
      required:
        - endpoint
        - eventProfile
        - name
        - subscribedChannels
      description: >
        Webhook to create. Organization fanout may be supplied inline per channel so that
        the webhook and its fanout are created atomically; afterwards it is managed
        through the channel resource.
      properties:
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        eventProfile:
          $ref: '#/components/schemas/EventProfile'
        name:
          type: string
          description: Webhook name.
          example: Login Webhook.
        secret:
          type: string
          writeOnly: true
          description: >
            Secret used to sign webhook payloads, so the receiver can verify them. Never
            returned by any operation.


            Whether it applies depends on the event profile, which determines how payloads
            are signed. Profiles that sign with a shared secret require it; profiles that
            sign with a key pair do not.
          example: my-secret
        subscribedChannels:
          type: array
          minItems: 1
          description: Channels to subscribe to, each with optional organization fanout.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: "https://schemas.identity.wso2.org/events/login"
              childOrgSubscription:
                subscriptionPolicy: "NONE"
            - channelUri: "https://schemas.identity.wso2.org/events/registration"
              childOrgSubscription:
                subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
            - channelUri: "https://schemas.identity.wso2.org/events/token"
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
                organizations:
                  - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"
                  - orgId: "a17b28ca-9f89-449c-ae27-fa955e66465f"
            - channelUri: "https://schemas.identity.wso2.org/events/user"
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: >
            Desired webhook status on create. The retrieval response reports the derived
            aggregate status, which may also be `PARTIALLY_ACTIVE` or
            `PARTIALLY_INACTIVE` while channels settle.
          example: "ACTIVE"

    # =========================================================================
    # Webhook — update
    # =========================================================================
    WebhookUpdateRequest:
      type: object
      required:
        - endpoint
        - eventProfile
        - name
        - subscribedChannels
      description: >
        Full replacement of a webhook, including per-channel organization fanout. This is
        the retrieval representation minus the read-only properties, so a retrieved
        webhook can be modified and sent back as-is.


        The two write-only properties — `secret` and
        `subscribedChannels[].childOrgSubscription.organizations` — are never returned
        and are therefore preserved when omitted rather than cleared.
      properties:
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        eventProfile:
          $ref: '#/components/schemas/EventProfile'
        name:
          type: string
          description: Webhook name.
          example: Login Webhook.
        secret:
          type: string
          writeOnly: true
          description: >
            Secret for validating webhook payloads. Never returned by any operation, so
            omitting it preserves the stored secret rather than clearing it.
          example: my-secret
        subscribedChannels:
          type: array
          minItems: 1
          description: >
            The channels this webhook should be subscribed to, with their organization
            fanout. Replaced wholesale: channels absent from the array are unsubscribed,
            and channels present but not stored are subscribed.


            A channel that omits `childOrgSubscription` entirely keeps its current
            policy if it is already subscribed, or defaults to `NONE` if it is new.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: "https://schemas.identity.wso2.org/events/login"
              childOrgSubscription:
                subscriptionPolicy: "NONE"
            - channelUri: "https://schemas.identity.wso2.org/events/registration"
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
                organizations:
                  - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"

    WebhookPatchRequest:
      type: object
      minProperties: 1
      description: >
        JSON Merge Patch document (RFC 7386) describing the properties to change. Every
        property is optional and an omitted property is left unchanged. `status` is not
        patchable — use the activate and deactivate sub-resources.


        No property is `nullable`: a `null` member is rejected with `400` rather than
        removing the property, because no webhook property has a valid removed state.
        `minProperties` likewise rejects an empty document, which RFC 7386 would otherwise
        treat as a no-op. Both deviations are deliberate and documented on the operation.
      properties:
        endpoint:
          type: string
          description: Replaces the webhook URL.
          example: https://example.com/webhook
        name:
          type: string
          description: Replaces the webhook name.
          example: Login Webhook.
        secret:
          type: string
          writeOnly: true
          description: Replaces the secret used to validate webhook payloads. Omit to keep the current secret.
          example: my-new-secret
        subscribedChannels:
          type: array
          minItems: 1
          description: >
            Replaces the entire channel set, with the same semantics as the replace
            operation. Omit the property to leave subscriptions untouched.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: "https://schemas.identity.wso2.org/events/login"
              childOrgSubscription:
                subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
            - channelUri: "https://schemas.identity.wso2.org/events/token"
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
                organizations:
                  - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"

    # =========================================================================
    # Webhook — response
    # =========================================================================
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: 'eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c'
        createdAt:
          type: string
          readOnly: true
          example: '2024-05-01T12:00:00Z'
        updatedAt:
          type: string
          readOnly: true
          example: '2024-05-02T12:00:00Z'
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        eventProfile:
          $ref: '#/components/schemas/EventProfile'
        name:
          type: string
          description: Webhook name.
          example: Login webhook.
        subscribedChannels:
          type: array
          description: >
            List of subscribed channels with their subscription status and child
            organization fanout policy. The organizations themselves are not included —
            follow each channel's `childOrgSubscription.organizationsRef` to retrieve
            them, paginated and resolved with names and parent references.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          example:
            - channelUri: https://schemas.identity.wso2.org/events/login
              channelId: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
              self: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
              status: SUBSCRIPTION_ACCEPTED
              childOrgSubscription:
                subscriptionPolicy: "NONE"
            - channelUri: https://schemas.identity.wso2.org/events/registration
              channelId: 4d81e0c7-6f52-4a19-b3ce-118d9f27a604
              self: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/4d81e0c7-6f52-4a19-b3ce-118d9f27a604
              status: SUBSCRIPTION_ACCEPTED
              childOrgSubscription:
                subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
            - channelUri: https://schemas.identity.wso2.org/events/token
              channelId: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
              self: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
              status: SUBSCRIPTION_ACCEPTED
              childOrgSubscription:
                subscriptionPolicy: "SELECTED_ORGS_ONLY"
        status:
          type: string
          readOnly: true
          enum:
            - ACTIVE
            - PARTIALLY_ACTIVE
            - INACTIVE
            - PARTIALLY_INACTIVE
          description: >
            Aggregate webhook status derived from the per-channel subscription statuses.
            Changed through the activate and deactivate sub-resources.
          example: "ACTIVE"

    WebhookSubscription:
      type: object
      required:
        - channelUri
      description: >
        A subscribed channel as it appears on the webhook resource. Used by the create,
        replace, patch and retrieval operations.


        `channelUri` and `childOrgSubscription.subscriptionPolicy` round-trip between
        request and response. `childOrgSubscription.organizations` is write-only —
        the organization list is a paginated collection read from the channel resource
        linked by `self`. The remaining properties are observed state, ignored if
        supplied in a request.
      properties:
        channelUri:
          type: string
          description: Channel URI to subscribe to.
          example: https://schemas.identity.wso2.org/events/login
        childOrgSubscription:
          $ref: '#/components/schemas/ChildOrgSubscription'
        channelId:
          type: string
          readOnly: true
          description: >
            Unique identifier of this subscribed channel, used to address the channel
            resource.
          example: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
        self:
          type: string
          readOnly: true
          description: >
            Link to this subscribed channel. Follow it to reach the channel resource,
            which carries `childOrgSubscription.organizationsRef` — the link to the child
            organizations receiving events. Each representation links one level down, so
            the webhook response stays free of nested organization links.
          example: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
        status:
          type: string
          readOnly: true
          enum:
            - SUBSCRIPTION_ACCEPTED
            - SUBSCRIPTION_PENDING
            - SUBSCRIPTION_ERROR
            - UNSUBSCRIPTION_ACCEPTED
            - UNSUBSCRIPTION_PENDING
            - UNSUBSCRIPTION_ERROR
          description: Status of the subscription.
          example: SUBSCRIPTION_PENDING

    # =========================================================================
    # Channel
    # =========================================================================
    ChildOrgSubscription:
      type: object
      required:
        - subscriptionPolicy
      description: >
        Fanout configuration controlling which <b>child</b> organizations of the webhook's
        own organization receive events for a channel. Supplied inline per channel on the
        webhook create, replace and patch operations.


        Named `childOrgSubscription` rather than `organizationSubscription` because the
        organization owning the webhook is itself an organization. Sub-organizations can
        own webhooks too, and at that level the owner subscribes to events from
        organizations below it — so an unqualified "organization" would not say whose
        events are meant. This names the direction explicitly: downward, into descendants.


        `subscriptionPolicy` round-trips: it is returned by every operation that returns a
        channel, and accepted by every operation that writes one. `organizations` is
        write-only, because the subscribed organizations are a paginated collection — read
        them from the resource linked as `organizationsRef`.
      properties:
        subscriptionPolicy:
          type: string
          default: NONE
          enum:
            - NONE
            - ALL_EXISTING_AND_FUTURE_ORGS
            - SELECTED_ORGS_ONLY
          description: >
            Organization-level fanout policy for this channel.
            `NONE` – no organization-level fanout.
            `ALL_EXISTING_AND_FUTURE_ORGS` – events fanned out to every organization, including ones created in the future.
            `SELECTED_ORGS_ONLY` – events delivered only to the organizations listed in the `organizations` array.
            Selected organizations do not include their children.
          example: SELECTED_ORGS_ONLY
        organizations:
          type: array
          writeOnly: true
          minItems: 1
          maxItems: 100
          description: >
            Explicit list of organizations to receive events. Accepted only when
            `subscriptionPolicy` is `SELECTED_ORGS_ONLY`; rejected under any other policy.


            Must be non-empty. `SELECTED_ORGS_ONLY` with nothing selected is the same
            state as `NONE`, so it is not a second way to express it — to stop
            organization fanout, set `subscriptionPolicy` to `NONE`.


            <b>Write-only, and preserved when omitted.</b> This is the only
            preserve-on-omit rule besides `secret`, and it exists for the same reason —
            the list is never returned, so a client performing a read-modify-write cycle
            cannot resend it. Concretely:


            - **omitted** — the channel's current organization subscriptions are left
              exactly as they are, whatever else the request changes.

            - **supplied** — replaced wholesale against the organizations currently
              subscribed: those present are subscribed, those absent are unsubscribed.


            Required when a channel is *first* set to `SELECTED_ORGS_ONLY`, since there is
            nothing to preserve.


            Only `orgId` is supplied; the organizations resource returns the same objects
            with `orgName` and `parentOrgId` resolved.
          items:
            $ref: '#/components/schemas/Organization'
          example:
            - orgId: "b028ca17-8f89-449c-ae27-fa955e66465d"
            - orgId: "a17b28ca-9f89-449c-ae27-fa955e66465f"
        organizationsRef:
          type: string
          readOnly: true
          description: >
            Link to the child organizations currently receiving events for this channel,
            resolved with names and parent references and paginated.


            <b>Returned by the channel resource only.</b> It is omitted from the webhook
            representation, which offers `self` on each channel instead — so each
            representation links one level down and the webhook response does not carry
            two URLs per channel. Where it is returned it is always present, including
            under `NONE`, where the referenced resource yields an empty list.
          example: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219/organizations

    ChannelResponse:
      type: object
      description: >
        A single subscribed channel of a webhook, with its subscription status and child
        organization fanout policy.


        Carries `childOrgSubscription.organizationsRef` — the link to the paginated
        collection of child organizations receiving events. The webhook representation
        omits that link and offers `self` on each channel instead, so navigation proceeds
        one level at a time: webhook, then channel, then organizations.
      properties:
        channelId:
          type: string
          readOnly: true
          description: Unique identifier of this subscribed channel.
          example: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
        channelUri:
          type: string
          readOnly: true
          description: Channel URI.
          example: https://schemas.identity.wso2.org/events/token
        status:
          type: string
          readOnly: true
          enum:
            - SUBSCRIPTION_ACCEPTED
            - SUBSCRIPTION_PENDING
            - SUBSCRIPTION_ERROR
            - UNSUBSCRIPTION_ACCEPTED
            - UNSUBSCRIPTION_PENDING
            - UNSUBSCRIPTION_ERROR
          description: Status of the subscription.
          example: SUBSCRIPTION_ACCEPTED
        childOrgSubscription:
          $ref: '#/components/schemas/ChildOrgSubscription'
    Organization:
      type: object
      required:
        - orgId
      description: >
        A child organization receiving events for a channel. Requests supply `orgId` only;
        responses add the resolved name and parent.
      properties:
        orgId:
          type: string
          description: >
            Organization ID. Only this organization is subscribed — its own child
            organizations are not included, and children created later are not added.
          example: b028ca17-8f89-449c-ae27-fa955e66465d
        orgName:
          type: string
          readOnly: true
          description: Organization name.
          example: sub003
        parentOrgId:
          type: string
          readOnly: true
          description: >
            Immediate parent organization, for reconstructing the hierarchy.
            **May reference an organization that is not present in this response** —
            because it is not itself subscribed, or because it falls on another page.
            Results are ordered parents-before-children, so a client building the tree
            in order can treat an unresolved parent as the root of a rendered subtree.
          example: 7c1f9a83-5b2e-41d7-9f30-2ac4e8b16d55

    SubscribedOrganizationList:
      type: object
      description: >
        Paginated list of the child organizations currently receiving events for a
        channel, with the context needed to interpret it.


        This is a paginated view of a sub-collection, not a value that can be sent back —
        `organizations` holds only the current page, so echoing it into a webhook write
        would unsubscribe everything outside that page. Writes take the plain array under
        `childOrgSubscription.organizations`.
      properties:
        channelUri:
          type: string
          readOnly: true
          description: Channel URI this list belongs to.
          example: https://schemas.identity.wso2.org/events/registration
        subscriptionPolicy:
          type: string
          readOnly: true
          enum:
            - NONE
            - ALL_EXISTING_AND_FUTURE_ORGS
            - SELECTED_ORGS_ONLY
          description: >
            Child organization fanout policy configured for this channel, included so the
            list can be interpreted without a second call. `NONE` always yields an empty
            list.
          example: ALL_EXISTING_AND_FUTURE_ORGS
        totalResults:
          type: integer
          description: >
            Total number of child organizations subscribed to this channel. Under
            `ALL_EXISTING_AND_FUTURE_ORGS` this can change between pages as organizations
            are created.
          example: 142
        startIndex:
          type: integer
          description: Index of the first record in this response.
          example: 0
        count:
          type: integer
          description: Number of records returned in this response.
          example: 2
        organizations:
          type: array
          description: >
            The child organizations on this page, ordered parents before children.
          items:
            $ref: '#/components/schemas/Organization'

    # =========================================================================
    # Shared
    # =========================================================================
    EventProfile:
      type: object
      required:
        - name
        - uri
      properties:
        name:
          type: string
          description: Webhook Event Profile.
          example: WSO2
        uri:
          type: string
          description: Webhook Event Profile URI.
          example: https://schemas.identity.wso2.org/events

    WebhookSummary:
      type: object
      properties:
        id:
          type: string
          example: 'eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c'
        createdAt:
          type: string
          example: '2024-05-01T12:00:00Z'
        updatedAt:
          type: string
          example: '2024-05-02T12:00:00Z'
        endpoint:
          type: string
          description: Webhook URL.
          example: https://example.com/webhook
        name:
          type: string
          description: Webhook name.
          example: Login webhook.
        status:
          type: string
          enum:
            - ACTIVE
            - PARTIALLY_ACTIVE
            - INACTIVE
            - PARTIALLY_INACTIVE
          description: Webhook Status.
          example: "ACTIVE"
        self:
          type: string
          example: /t/{organization-name}/api/server/v2/webhooks/123e4567-e89b-12d3-a456-556642440000

    WebhookList:
      type: object
      properties:
        totalResults:
          type: integer
          description: Total number of webhooks available.
          example: 12
        startIndex:
          type: integer
          description: Index of the first record in this response.
          example: 0
        count:
          type: integer
          description: Number of records returned in this response.
          example: 12
        links:
          type: array
          description: Navigation links. Contains `next` and `previous` where applicable.
