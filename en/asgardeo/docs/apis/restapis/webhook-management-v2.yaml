openapi: 3.0.0
info:
  version: v2
  title: WSO2 Identity Platform - Webhook Management Rest API
  description: >
    The Webhook Management REST API provides a standardized interface to manage webhooks within WSO2 Identity Platform. Webhooks allow external systems to receive real-time notifications for various events, such as login successes or failures, enabling seamless integration and automation across external applications and services.

    This API empowers developers and administrators to create, update, delete, and retrieve webhook configurations tailored to their specific business needs and event-driven workflows.


    <b>Changes from v1</b>


    v1 remains available at `/api/server/v1`.


    - `subscribedChannels` is a list of objects (`channelUri` and `childOrgSubscription`) instead of a list of channel URI strings.

    - The update operation no longer accepts `status`. Use the activate and deactivate operations instead.

    - Webhook status can also be `PARTIALLY_ACTIVE` or `PARTIALLY_INACTIVE`.

    - The webhook list is paginated.

    - New `PATCH` operation for partial updates.

    - Events can be fanned out to child organizations for each channel.

    - New channel and subscribed organizations resources.


    <b>Resource model</b>


    - A webhook has a set of subscribed channels. Each channel has a child organization subscription policy (`childOrgSubscription`).

    - Channels and their policies are written only through the webhook resource (create, update and patch).

    - Each channel in the webhook response has a `self` link to the channel resource.

    - The channel resource has an `organizationsRef` link to the paginated list of child organizations that receive events.
servers:
  - url: 'https://api.asgardeo.io/t/{organization-name}/api/server/v2'

security:
  - OAuth2: []

paths:
  /webhooks:
    get:
      summary: List Webhooks
      description: "This API returns the detailed summary of the webhooks.\n\n
        Results are paginated. Use `limit` and `offset` to page through the collection;
        `totalResults` reports the full size and `links` carries the next and previous
        pages where applicable.\n\n
        <b>Scope(Permission) required:</b> `internal_webhook_view` \n\n"
      operationId: getWebhooks
      tags:
        - Webhooks
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location 'https://api.asgardeo.io/t/{organization-name}/api/server/v2/webhooks?limit=25&offset=0' \
            -H 'Authorization: Bearer {bearer_token}'

    post:
      summary: Add Webhook
      description: "Create a new webhook. \n\n
        `subscribedChannels` is a list of channel objects. Each channel may carry its
        organization fanout configuration inline under `childOrgSubscription`, so the
        webhook and its fanout are created together in one atomic call. A channel that
        omits it defaults to `subscriptionPolicy: NONE`.\n\n
        Fanout is changed later through the webhook replace and patch operations, which
        accept the same per-channel `childOrgSubscription`.\n\n
        <b>Scope(Permission) required:</b> `internal_webhook_create` \n\n"
      operationId: createWebhook
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Webhook Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
              examples:
                created:
                  summary: >
                    Created with `status: ACTIVE`. Subscription against the event publisher
                    is asynchronous, so every channel is still `SUBSCRIPTION_PENDING` and
                    the webhook reports `PARTIALLY_ACTIVE`. Retrieve the webhook again to
                    observe the channels settling to `SUBSCRIPTION_ACCEPTED`, or to
                    `SUBSCRIPTION_ERROR` if the publisher rejected one.
                  value:
                    id: eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c
                    createdAt: '2026-09-03T09:15:00Z'
                    updatedAt: '2026-09-03T09:15:00Z'
                    endpoint: https://example.com/webhook
                    name: Login Webhook
                    eventProfile:
                      name: WSO2
                      uri: https://schemas.identity.wso2.org/events
                    status: PARTIALLY_ACTIVE
                    subscribedChannels:
                      - channelUri: https://schemas.identity.wso2.org/events/login
                        channelId: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
                        self: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
                        status: SUBSCRIPTION_PENDING
                        childOrgSubscription:
                          subscriptionPolicy: "NONE"
                      - channelUri: https://schemas.identity.wso2.org/events/registration
                        channelId: 4d81e0c7-6f52-4a19-b3ce-118d9f27a604
                        self: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/4d81e0c7-6f52-4a19-b3ce-118d9f27a604
                        status: SUBSCRIPTION_PENDING
                        childOrgSubscription:
                          subscriptionPolicy: "ALL_EXISTING_AND_FUTURE_ORGS"
                      - channelUri: https://schemas.identity.wso2.org/events/token
                        channelId: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
                        self: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
                        status: SUBSCRIPTION_PENDING
                        childOrgSubscription:
                          subscriptionPolicy: "SELECTED_ORGS_ONLY"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request POST 'https://api.asgardeo.io/t/{organization-name}/api/server/v2/webhooks' \
            -H 'Authorization: Bearer {bearer_token}' \
            -H 'Content-Type: application/json' \
            -d '{
              "endpoint": "https://example.com/webhook",
              "name": "Login Webhook",
              "secret": "my-secret",
              "eventProfile": {
                "name": "WSO2",
                "uri": "https://schemas.identity.wso2.org/events"
              },
              "subscribedChannels": [
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/login",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "NONE"
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/registration",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "ALL_EXISTING_AND_FUTURE_ORGS"
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/token",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "SELECTED_ORGS_ONLY",
                    "organizations": [
                      { "orgId": "b028ca17-8f89-449c-ae27-fa955e66465d" },
                      { "orgId": "a17b28ca-9f89-449c-ae27-fa955e66465f" }
                    ]
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/user"
                }
              ],
              "status": "ACTIVE"
            }'

  /webhooks/{webhookId}:
    get:
      summary: Retrieve Webhook by ID
      description: "This API returns the webhook details along with the webhook unique ID. \n\n
        Each entry in `subscribedChannels` reports the channel URI, its identifier, its
        subscription status, its child organization fanout policy and a `self` link. The
        organizations themselves are not included — follow
        `childOrgSubscription.organizationsRef` to retrieve them, paginated and resolved
        with names and parent references.\n\n
        This representation is exactly what the replace operation accepts, so it can be
        modified and sent back without reshaping.\n\n
        <b>Scope(Permission) required:</b> `internal_webhook_view` \n\n"
      operationId: getWebhookByWebhookId
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location 'https://api.asgardeo.io/t/{organization-name}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}'

    put:
      summary: Update Webhook
      description: "This API updates a webhook and return the updated webhook. \n\n
        The request body is exactly the representation returned by the retrieval API,
        minus the read-only properties — which are ignored rather than rejected if
        supplied. A webhook can therefore be retrieved, modified and sent back unchanged
        otherwise.\n\n
        This is a full replacement: a writable property omitted from the body is cleared.
        The two write-only properties are the exception — `secret` and
        `subscribedChannels[].childOrgSubscription.organizations` are never returned,
        so a client cannot resend what it did not receive, and omitting either preserves
        the stored value.\n\n
        <b>Channels</b>\n\n
        `subscribedChannels` is replaced wholesale: channels stored but absent from the
        array are unsubscribed, and channels present but not stored are subscribed.\n\n
        Each channel may carry its `childOrgSubscription`, so a single call can change
        the webhook, its channel set and its per-channel fanout together. For a channel
        that omits `childOrgSubscription`, an existing subscription keeps its current
        policy and a new one defaults to `NONE`. Within a supplied
        `childOrgSubscription`, omitting `organizations` preserves the channel's
        current organization subscriptions; supplying it replaces them. To stop
        organization fanout for a channel, set its `subscriptionPolicy` to `NONE` — an
        empty `organizations` array is rejected, since `SELECTED_ORGS_ONLY` with nothing
        selected is the same state as `NONE`.\n\n
        Removing a channel and adding it back in the same request resets its fanout,
        because the subscription is recreated.\n\n
        <b>Scope(Permission) required:</b> `internal_webhook_update` \n\n"
      operationId: updateWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdateRequest'
      responses:
        '200':
          description: Webhook Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request PUT 'https://api.asgardeo.io/t/{organization-name}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}' \
            -H 'Content-Type: application/json' \
            -d '{
              "endpoint": "https://example.com/webhook",
              "name": "Login webhook",
              "eventProfile": {
                "name": "WSO2",
                "uri": "https://schemas.identity.wso2.org/events"
              },
              "subscribedChannels": [
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/login",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "SELECTED_ORGS_ONLY",
                    "organizations": [
                      { "orgId": "b028ca17-8f89-449c-ae27-fa955e66465d" }
                    ]
                  }
                },
                {
                  "channelUri": "https://schemas.identity.wso2.org/events/registration",
                  "childOrgSubscription": {
                    "subscriptionPolicy": "ALL_EXISTING_AND_FUTURE_ORGS"
                  }
                }
              ]
            }'

    patch:
      summary: Patch Webhook by ID
      description: "This API partially updates a webhook and returns the updated webhook. \n\n
        Only the properties present in the request body are modified; every omitted
        property is left unchanged. This avoids the full-replacement behaviour of `PUT`,
        which clears any writable property the client does not resend.\n\n
        Arrays are replaced wholesale rather than merged. Supplying `subscribedChannels`
        therefore replaces the entire channel set, with the same semantics as `PUT`,
        including per-channel `childOrgSubscription`. Because the retrieval API returns
        every channel with its policy, a client can read the webhook, adjust one channel
        in the array and send the whole set back.\n\n
        `status` cannot be patched; use the activate and deactivate sub-resources.\n\n
        <b>JSON Merge Patch</b>\n\n
        The request body is a JSON Merge Patch document (RFC 7386), sent as
        `application/merge-patch+json`. It is not JSON Patch (RFC 6902) — there is no
        operation list; the body is a partial representation of the webhook itself.\n\n
        Two deviations from RFC 7386 apply, both of which fail loudly rather than
        silently:\n\n
        - A `null` member is <b>rejected with 400</b> rather than removing the property.
          No webhook property has a valid removed state: `endpoint`, `name`,
          `eventProfile` and `subscribedChannels` are required; a channel's organization
          fanout is cleared by setting `subscriptionPolicy` to `NONE` rather than by
          removal; and `secret` must never be removed, since a webhook that cannot sign
          its payloads delivers events no receiver can verify. Nulls are rejected instead
          of ignored so that a client assuming removal is told, rather than receiving
          `200` for a change that did not happen.

        - An empty document `{}` is <b>rejected with 400</b>, although RFC 7386 defines it
          as a valid no-op. An empty patch is almost always a client error and is worth
          reporting.\n\n
        Should a property that can validly be removed be introduced later, it will be
        marked `nullable` and accept `null` as a removal directive; the rejection above
        applies only to properties for which removal has no valid result.\n\n
        <b>Scope(Permission) required:</b> `internal_webhook_update` \n\n"
      operationId: patchWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WebhookPatchRequest'
            examples:
              renameOnly:
                summary: Rename a webhook, leaving everything else untouched
                value:
                  name: Login and registration webhook
              changeEndpoint:
                summary: Repoint the webhook
                value:
                  endpoint: https://example.com/webhook/v2
              rotateSecret:
                summary: Replace the signing secret
                value:
                  secret: my-new-secret
              changeChannels:
                summary: >
                  Replace the channel set. `login` omits `childOrgSubscription`, so
                  it keeps whatever policy it already had; `token` sets its policy and
                  organization list explicitly.
                value:
                  subscribedChannels:
                    - channelUri: https://schemas.identity.wso2.org/events/login
                    - channelUri: https://schemas.identity.wso2.org/events/token
                      childOrgSubscription:
                        subscriptionPolicy: SELECTED_ORGS_ONLY
                        organizations:
                          - orgId: b028ca17-8f89-449c-ae27-fa955e66465d
      responses:
        '200':
          description: Webhook Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: >
            Bad Request. Also returned when a member is `null` — no webhook property
            has a valid removed state, so `null` is rejected rather than treated as a
            removal directive — and when the document is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request PATCH 'https://api.asgardeo.io/t/{organization-name}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}' \
            -H 'Content-Type: application/merge-patch+json' \
            -d '{
              "name": "Login and registration webhook"
            }'

    delete:
      summary: Delete Webhook
      description: "This API deletes a webhook using the webhook unique ID. \n\n <b>Scope(Permission) required:</b> `internal_webhook_delete` \n\n"
      operationId: deleteWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Webhook Deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location --request DELETE 'https://api.asgardeo.io/t/{organization-name}/api/server/v2/webhooks/{webhookId}' \
            -H 'Authorization: Bearer {bearer_token}'

  /webhooks/{webhookId}/channels/{channelId}:
    get:
      summary: Retrieve Subscribed Channel by ID
      description: "This API returns a single subscribed channel of a webhook, with its
        subscription status and child organization fanout policy.\n\n
        The `channelId` is the unique identifier of the subscribed channel, returned as
        `channelId` on each entry in `subscribedChannels` by the webhook retrieval API,
        which also carries the `self` link to this resource.\n\n
        This response carries `childOrgSubscription.organizationsRef`, the link to the
        child organizations receiving events for the channel. That link is present here
        and not in the webhook representation, so each representation links exactly one
        level down and the webhook response stays free of nested organization links.\n\n
        <b>Scope(Permission) required:</b> `internal_webhook_view` \n\n"
      operationId: getWebhookChannel
      tags:
        - Webhook Channels
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelResponse'
              examples:
                selectedOrgs:
                  summary: Channel delivered to explicitly selected child organizations
                  value:
                    channelId: 2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219
                    channelUri: https://schemas.identity.wso2.org/events/token
                    status: SUBSCRIPTION_ACCEPTED
                    childOrgSubscription:
                      subscriptionPolicy: SELECTED_ORGS_ONLY
                      organizationsRef: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/2b6e5a7d-4c88-4e01-9a73-0f5cb8e3d219/organizations
                allOrgs:
                  summary: Channel fanned out to every child organization
                  value:
                    channelId: 4d81e0c7-6f52-4a19-b3ce-118d9f27a604
                    channelUri: https://schemas.identity.wso2.org/events/registration
                    status: SUBSCRIPTION_ACCEPTED
                    childOrgSubscription:
                      subscriptionPolicy: ALL_EXISTING_AND_FUTURE_ORGS
                      organizationsRef: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/4d81e0c7-6f52-4a19-b3ce-118d9f27a604/organizations
                noFanout:
                  summary: >
                    Channel with no child organization fanout. `organizationsRef` is still
                    present; the referenced resource returns an empty list.
                  value:
                    channelId: 9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88
                    channelUri: https://schemas.identity.wso2.org/events/login
                    status: SUBSCRIPTION_ACCEPTED
                    childOrgSubscription:
                      subscriptionPolicy: NONE
                      organizationsRef: /t/{organization-name}/api/server/v2/webhooks/eeb8c1a2-3f4d-4e5b-8c6f-7d8e9f0a1b2c/channels/9f2c7b31-0a4e-4d8f-9c11-2b6e5a7d4c88/organizations
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook or channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --location 'https://api.asgardeo.io/t/{organization-name}/api/server/v2/webhooks/{webhookId}/channels/{channelId}' \
            -H 'Authorization: Bearer {bearer_token}'
  /webhooks/{webhookId}/channels/{channelId}/organizations:
    get:
      summary: List Child Organizations Subscribed to a Channel
      description: "This API returns the child organizations currently receiving events for
        the given channel, resolved with names and parent references.\n\n
        For `SELECTED_ORGS_ONLY` this is the configured set; for
        `ALL_EXISTING_AND_FUTURE_ORGS` it is every child organization currently
        subscribed, which grows as organizations are created; for `NONE` the list is
        empty.\n\n
        This is the only representation of the subscribed organizations. The webhook and
        channel retrieval APIs report the policy and link here, because the collection is
        paginated and cannot be embedded in either representation.\n\n
        Results are ordered parents before children, so the hierarchy can be
        reconstructed from `parentOrgId` in a single pass.\n\n
        <b>Scope(Permission) required:</b> `internal_webhook_view` \n\n"
      operationId: getChannelSubscribedOrganizations
      tags:
        - Webhook Channels
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/ChannelId'
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribedOrganizationList'
              examples:
                allOrgsPolicy:
                  summary: >
                    Channel fanned out to every child organization. `totalResults` grows
                    as organizations are created, so it can change between pages.
                  value:
                    channelUri: https://schemas.identity.wso2.org/events/registration
                    subscriptionPolicy: ALL_EXISTING_AND_FUTURE_ORGS
                    totalResults: 142
                    startIndex: 0
                    count: 2
                    organizations:
                      - orgId: dd8e0455-29a1-4c73-8d6b-60f88c607d38
                        orgName: sub001
                        parentOrgId: 0e4a3c92-1f7b-4d58-9a06-b3e5c1d78f24
                      - orgId: 7c1f9a83-5b2e-41d7-9f30-2ac4e8b16d55
                        orgName: sub002
                        parentOrgId: dd8e0455-29a1-4c73-8d6b-60f88c607d38
                selectedOrgsPolicy:
                  summary: >
                    Channel delivered to explicitly selected child organizations, resolved
                    with names and parents.
                  value:
                    channelUri: https://schemas.identity.wso2.org/events/token
                    subscriptionPolicy: SELECTED_ORGS_ONLY
                    totalResults: 2
                    startIndex: 0
                    count: 2
                    organizations:
                      - orgId: b028ca17-8f89-449c-ae27-fa955e66465d
                        orgName: sub003
                        parentOrgId: 7c1f9a83-5b2e-41d7-9f30-2ac4e8b16d55
                      - orgId: a17b28ca-9f89-449c-ae27-fa955e66465f
                        orgName: sub004
                        parentOrgId: b028ca17-8f89-449c-ae27-fa955e66465d
                noFanout:
                  summary: Channel with no child organization fanout
                  value:
                    channelUri: https://schemas.identity.wso2.org/events/login
                    subscriptionPolicy: NONE
                    totalResults: 0
                    startIndex: 0
                    count: 0
                    organizations: []
        '400':
